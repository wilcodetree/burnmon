<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BurnMon Dev</title>
<style>
:root{
  --bg:#04060a; --panel:#0a0e14; --panel2:#10151d; --bd:#1c2532;
  --amber:#ffa028; --amber2:#ffc46b;
  --txt:#cfd8e3; --dim:#66788c;
  --grn:#00d26a; --red:#ff4b4b; --blu:#4da6ff; --cyn:#38d3e3; --mag:#d68cf0; --yel:#ffd75f;
  --mono:Consolas,"Cascadia Mono","IBM Plex Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--txt); overflow:hidden;
  font:13px/1.45 var(--mono);
  display:flex; flex-direction:column;
}
/* No default OS scrollbar chrome anywhere (section 10, "no horizontal
   scroll" plus Wilco's own review: the native gray scrollbar clashed with
   the dark theme on the harness heatmap's horizontal scroll). The turn
   ticker and the harness heatmap still genuinely need to scroll internally
   (more rows/columns than fit); this keeps that working via a thin,
   theme-matched bar instead of hiding scroll entirely. WebView2 is
   Chromium-based, so the ::-webkit-scrollbar family applies everywhere in
   this app, not just a Safari-specific corner case. */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
::-webkit-scrollbar-corner{background:transparent}

/* header, UI review patch section 1: smaller, quieter, no boxed chips */
header{
  flex:0 0 auto; min-height:32px; background:#000; border-bottom:2px solid var(--amber);
  display:flex; align-items:center; flex-wrap:wrap; gap:4px 16px; padding:5px 14px;
}
.brand{display:flex; flex-direction:column; gap:0; flex:0 0 auto; line-height:1.15}
.logo{font-size:13px; font-weight:700; color:#fff; letter-spacing:1px; white-space:nowrap}
.logo span{color:var(--amber)}
.pressuretext{font-size:10px; font-weight:700; letter-spacing:.06em; white-space:nowrap}
.hltotal{font-size:22px; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; white-space:nowrap}
.hstat{font-size:11.5px; color:var(--dim); white-space:nowrap}
.hstat b{color:var(--txt); font-weight:600; font-variant-numeric:tabular-nums}
.hdrspacer{flex:1 1 auto; min-width:4px}
.textbtn{background:none; border:none; color:var(--blu); font:700 11.5px/1 var(--mono);
  letter-spacing:.06em; text-transform:uppercase; cursor:pointer; padding:2px 0}
.textbtn:hover{text-decoration:underline}
.textbtn:disabled{opacity:.5; cursor:default; text-decoration:none}

main{flex:1; min-height:0; min-width:0; display:flex; flex-direction:column; padding:4px; gap:4px}
.zone{display:flex; flex-direction:column; min-height:0; min-width:0}
.zone.burn{flex:45}
.zone.system{flex:55; border-top:2px solid var(--bd); padding-top:4px}

/* section 10, responsive: below 900px one compact column; 900-1599px one
   column (the portrait design, the two rules above); from 1600px two
   columns, burn left and system right, each stretching to the window's
   full height instead of splitting it 45/55 vertically (main becomes a
   row, so flex:45/55 above now sizes each column's width instead). */
@media (min-width: 1600px){
  main{flex-direction:row}
  .zone.burn{border-right:2px solid var(--bd); padding-right:4px}
  .zone.system{border-top:none; padding-top:0}
}
@media (max-width: 899px){
  main{padding:2px; gap:2px}
  .zonebody{padding:2px; gap:2px}
  .cards{gap:4px}
  .sysbottom{flex-direction:column}
}
.zonelabel{
  flex:0 0 auto; background:var(--panel2); border-bottom:1px solid var(--bd); color:var(--amber);
  font:700 12px/1 var(--mono); letter-spacing:.1em; padding:6px 10px; text-transform:uppercase;
}
.zonebody{flex:1; min-height:0; padding:4px; display:flex; flex-direction:column; gap:4px; overflow:hidden}
.panel{background:var(--panel); border:1px solid var(--bd); display:flex; flex-direction:column; min-height:0}
.panelhead{font:700 11px/1 var(--mono); letter-spacing:.08em; color:var(--amber); text-transform:uppercase;
  padding:6px 10px; border-bottom:1px solid var(--bd); background:var(--panel2); flex:0 0 auto}
.placeholder{flex:1; display:flex; align-items:center; justify-content:center; color:var(--dim);
  font-size:12px; padding:20px; text-align:center}

/* burn zone, section 2: bars only (no CPU overlay), per-session stacking, HH:mm axis */
.burnchart{position:relative; flex:0 0 24%; padding:6px 6px 0; overflow:hidden; display:flex; flex-direction:column}
.bars{position:relative; flex:1; display:flex; gap:2px; min-height:0}
.bars .bar{flex:1; display:flex; flex-direction:column-reverse; min-width:0}
.bars .bar i{display:block; min-height:2px}
.overlay{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.burnaxis{display:flex; gap:2px; padding:2px 0 4px; flex:0 0 auto}
.axistick{flex:1; font-size:9px; color:var(--dim); white-space:nowrap; overflow:visible}
.cards{display:flex; gap:6px; flex-wrap:wrap; flex:0 0 auto}
.card{flex:1 1 140px; background:var(--panel); border:1px solid var(--bd); padding:8px 10px; min-width:0}
.card h4{margin:0 0 4px; font:12px/1 var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ctxbar{height:5px; background:#1a2330; margin:4px 0}
.ctxbar i{display:block; height:100%}
.card small{display:block; font:11px/1.4 var(--mono); color:var(--dim)}
.card small b{color:var(--txt); font-weight:600}

table{width:100%; border-collapse:collapse; font:11.5px/1.3 var(--mono)}
th{color:var(--dim); font-weight:400; text-align:right; letter-spacing:.05em; font-size:10px; padding:4px 8px; text-transform:uppercase}
th:first-child{text-align:left}
td{padding:4px 8px; color:var(--txt); white-space:nowrap}
td.num{text-align:right; font-variant-numeric:tabular-nums}
.dot{display:inline-block; width:8px; height:8px; border-radius:1px; margin-right:5px; vertical-align:middle}

/* vendor strip totals row, section 3 */
tr.totalrow td{font-weight:700; color:#fff; border-bottom:1px solid var(--bd)}

/* turn ticker, section 5: dense lines, amber outline tag, white tokens, hover, click */
.ticker{display:flex; flex-direction:column; gap:2px; flex:1; min-height:0; overflow-y:auto; padding:4px 10px}
.trow{display:flex; gap:8px; align-items:baseline; font:11.5px/1.35 var(--mono); white-space:nowrap; overflow:hidden;
  padding:1px 4px; cursor:default}
.trow.clickable{cursor:pointer}
.trow.clickable:hover{background:var(--panel2)}
.trow .t{color:var(--dim)}
.trow .h{font-weight:700}
.trow .m{color:#fff; overflow:hidden; text-overflow:ellipsis}
.tag{font:10px/1 var(--mono); padding:1px 5px; border:1px solid var(--amber); color:var(--amber);
  text-transform:uppercase; letter-spacing:.03em}

/* turn detail popup, section 5 */
#turnPopupOverlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:1000; align-items:center; justify-content:center}
#turnPopupOverlay.hidden{display:none}
#turnPopupOverlay:not(.hidden){display:flex}
#turnPopup{position:relative; background:var(--panel); border:1px solid var(--amber); color:var(--txt);
  padding:18px 20px; width:480px; max-width:92vw; max-height:84vh; overflow-y:auto; font-size:12px}
#turnPopup h3{margin:0 0 2px; color:#fff; font-size:14px}
#turnPopup h4{margin:14px 0 5px; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--amber)}
#turnPopupClose{position:absolute; top:10px; right:12px; background:none; border:none; color:var(--dim);
  font-size:18px; line-height:1; cursor:pointer}
#turnPopupClose:hover{color:var(--txt)}
#turnPopup table{font-size:11px}
#turnPopup ul.tight{margin:0; padding-left:18px}

/* vendor strip row expand */
tbody tr.vrow{cursor:pointer}
tbody tr.vrow:hover{background:var(--panel2)}
tr.vexpand td{padding:6px 8px 8px 24px; color:var(--txt); font-size:11px; background:#0d1219; border-top:1px dashed var(--bd)}
tr.vexpand b{font-variant-numeric:tabular-nums}

/* activity + harness heatmap, section 4: side by side */
.splitrow{display:flex; gap:4px; flex:0 0 auto}
.splitrow > .panel:first-child{flex:0 0 40%; min-width:0}
.splitrow > .panel:last-child{flex:1; min-width:0}
@media (max-width: 899px){
  .splitrow{flex-direction:column}
  .splitrow > .panel:first-child{flex:0 0 auto}
}

/* activity heatmap, phase 2b */
.phead-sub{float:right; color:var(--dim); font-weight:400; text-transform:none; letter-spacing:0}
.heatmapwrap{padding:8px 10px; overflow-x:auto}
.heatgrid{display:flex; gap:2px}
.heatcol{display:flex; flex-direction:column; gap:2px}
.heatcell{width:9px; height:9px; background:var(--bd); border-radius:1px}
.heatcell.active{background:var(--grn)}
.heatcell.empty{background:transparent}
.heatmonths{display:flex; gap:2px; margin-top:3px}
.heatmonth{width:9px; font-size:8px; color:var(--dim); overflow:visible; white-space:nowrap}

/* harness x minute heatmap, phase 3 */
.heatrow{display:flex; align-items:center; gap:6px; margin-bottom:2px}
.heatrow-label{width:110px; flex:0 0 auto; font-size:11px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.heatrow-cells{display:flex; gap:1px; flex-wrap:nowrap}

/* system panel, section 6: perfadvisor layout, smoother and a little smaller */
.cpubox{padding:8px 10px; flex:0 0 auto}
.cpubox h4{margin:0 0 6px; font:11px/1 var(--mono); color:var(--dim); letter-spacing:.05em; text-transform:uppercase; font-weight:400}
.cpubar{position:relative; height:16px; background:#10151d; border:1px solid var(--bd); margin-bottom:2px}
.cpubar i{display:block; height:100%; background:var(--grn)}
.cpubar span{position:absolute; right:6px; top:0; line-height:16px; font-size:11px; color:#fff; font-variant-numeric:tabular-nums}
.cpumeta{font-size:10px; color:var(--dim); margin-bottom:6px}
.coregrid{display:grid; grid-template-columns:repeat(5,1fr); gap:3px 6px}
.coreitem{display:flex; align-items:center; gap:4px; font-size:10px; color:var(--dim); min-width:0}
.corebar{position:relative; flex:1; height:8px; background:#10151d; border:1px solid var(--bd); min-width:0}
.corebar i{display:block; height:100%}
.corelabel{flex:0 0 auto; white-space:nowrap; font-variant-numeric:tabular-nums}

.histwrap{flex:1; min-height:60px; padding:6px 10px; display:flex; flex-direction:column}
.histlegend{display:flex; gap:12px; flex-wrap:wrap; font-size:10px; color:var(--dim); margin-bottom:4px}
.histlegend b{font-weight:700}
.histlegend .note{margin-left:auto; color:var(--dim); font-style:italic}
.histcanvaswrap{flex:1; min-height:0}
#histCanvas{width:100%; height:100%; display:block}

.sysbottom{display:flex; gap:4px; flex:0 0 auto}
.sysbox{flex:1; background:var(--panel); border:1px solid var(--bd); padding:8px 10px; min-width:0}
.sysbox h4{margin:0 0 6px; font:10px/1 var(--mono); color:var(--dim); letter-spacing:.05em; text-transform:uppercase; font-weight:400}
.sysbar{position:relative; height:10px; background:#10151d; border:1px solid var(--bd); margin-bottom:4px}
.sysbar i{display:block; height:100%}
.sysbox .line{font-size:11px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sysbox .line b{color:#fff; font-variant-numeric:tabular-nums}
.sysbox .dim{color:var(--dim)}

/* process groups, section 7: trend column fills remaining width */
#processGroups td:last-child, #processGroupsHead th:last-child{width:100%}
.trendsvg{display:block; width:100%; height:14px}

/* Microsoft To Do panel, section 9: off by default, full width, sits below
   the two-column layout too (a sibling of main, not inside either zone). */
.todopanel{flex:0 1 auto; max-height:200px; margin:0 4px 4px; display:none; flex-direction:column}
.todobody{flex:1; min-height:0; overflow-y:auto; padding:6px 10px; display:flex; flex-direction:column; gap:3px}
.todorow{display:flex; gap:8px; align-items:baseline; font:11.5px/1.4 var(--mono); white-space:nowrap; overflow:hidden}
.todorow .due{color:var(--dim); flex:0 0 auto}
.todorow .due.overdue{color:var(--red)}
.todorow .title{color:var(--txt); overflow:hidden; text-overflow:ellipsis}
.todorow .list{color:var(--dim); flex:0 0 auto}
.tododevicecode{font-size:20px; font-weight:700; color:var(--amber); letter-spacing:.1em; margin:4px 0}

@media (max-aspect-ratio: 4/5){
  header{min-height:40px}
  .hltotal{font-size:28px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">BURN<span>MON</span> DEV</div>
    <div class="pressuretext" id="pressureChip">PRESSURE -</div>
  </div>
  <div class="hltotal" id="hlToday">-</div>
  <div class="hstat" id="hdrSessions">- sessions</div>
  <div class="hstat">$<b id="hdrBurnRate">-</b>/min</div>
  <div class="hstat"><b id="hdrTokMin">-</b> tok/min</div>
  <div class="hstat">CPU <b id="hdrCPU">-</b></div>
  <div class="hstat">RAM <b id="hdrRAM">-</b></div>
  <div class="hstat" id="hdrClock">-</div>
  <div class="hdrspacer"></div>
  <button class="textbtn" id="exportBtn" title="Export the last 24 hours to an AI-ready bundle">EXPORT</button>
  <div class="hstat" id="exportStatus"></div>
</header>
<main>
  <section class="zone burn">
    <div class="zonelabel">Burn, last 30 min</div>
    <div class="zonebody">
      <div class="burnchart panel">
        <div class="bars" id="burnBars"><svg class="overlay" id="turnMarkers" preserveAspectRatio="none"></svg></div>
        <div class="burnaxis" id="burnAxis"></div>
      </div>
      <div class="cards" id="sessionCards"></div>
      <div class="panel" style="flex:0 0 auto">
        <div class="panelhead">Vendor strip</div>
        <table>
          <thead><tr><th></th><th>Today</th><th>Week</th><th>Month</th></tr></thead>
          <tbody id="vendorStrip"></tbody>
        </table>
      </div>
      <div class="splitrow">
        <div class="panel">
          <div class="panelhead">Activity <span id="heatmapActiveDays" class="phead-sub"></span></div>
          <div class="heatmapwrap"><div id="heatmapGrid"></div></div>
        </div>
        <div class="panel">
          <div class="panelhead">Heatmap, harness &times; minute (CPU-weighted)</div>
          <div class="heatmapwrap" style="overflow-y:auto"><div id="harnessHeatmap"></div></div>
        </div>
      </div>
      <div class="panel" style="flex:1">
        <div class="panelhead">Turn ticker</div>
        <div class="ticker" id="turnTicker"></div>
      </div>
    </div>
  </section>
  <section class="zone system">
    <div class="zonelabel">System</div>
    <div class="zonebody">
      <div class="panel cpubox">
        <h4>CPU, <span id="cpuThreads">-</span> threads</h4>
        <div class="cpubar"><i id="cpuTotalBar" style="width:0%"></i><span id="cpuTotal">-</span></div>
        <div class="cpumeta" id="cpuBaseClock"></div>
        <div class="coregrid" id="coreGrid"></div>
      </div>
      <div class="panel histwrap">
        <div class="histlegend" id="histLegend"></div>
        <div class="histcanvaswrap"><canvas id="histCanvas"></canvas></div>
      </div>
      <div class="panel" style="flex:0 0 auto">
        <div class="panelhead" id="processGroupsHead">Process groups</div>
        <table>
          <thead><tr><th></th><th>CPU</th><th>RAM</th><th>IO/s</th><th>Trend</th></tr></thead>
          <tbody id="processGroups"></tbody>
        </table>
      </div>
      <div class="sysbottom">
        <div class="sysbox" id="boxMemory">
          <h4>Memory</h4>
          <div class="sysbar"><i style="background:var(--blu)"></i></div>
          <div class="line" id="memLine1">-</div>
          <div class="line dim" id="memLine2">-</div>
          <div class="line dim" id="memLine3">-</div>
        </div>
        <div class="sysbox" id="boxDisks">
          <h4>Disks</h4>
          <div id="disksBody"></div>
        </div>
        <div class="sysbox" id="boxNetwork">
          <h4>Network</h4>
          <div class="line" id="netDown">-</div>
          <div class="line" id="netUp">-</div>
          <div class="line dim" id="netWifi">-</div>
        </div>
      </div>
    </div>
  </section>
</main>
<section class="panel todopanel" id="todoPanel">
  <div class="panelhead">Microsoft To Do</div>
  <div class="todobody" id="todoBody"></div>
</section>
<div id="turnPopupOverlay" class="hidden">
  <div id="turnPopup">
    <button id="turnPopupClose" type="button" title="Close" aria-label="Close">&times;</button>
    <div id="turnPopupBody"></div>
  </div>
</div>
<script>
(function(){
  var AGENT_COLOR = {
    'claude-code': '#ffa028',
    'cowork': '#ffc46b',
    'codex': '#4da6ff',
    'hermes': '#d68cf0',
    'copilot-cli': '#38d3e3',
    'copilot-vscode': '#38d3e3'
  };
  // Fixed draw order for the burn chart's stacked segments: Object.keys on
  // a bucket's by-agent totals would otherwise follow whatever order the
  // Go map happened to marshal in, which is not stable poll to poll, so
  // segments would visibly swap position between bars.
  var AGENT_ORDER = ['claude-code', 'cowork', 'codex', 'hermes', 'copilot-cli', 'copilot-vscode', 'other'];
  function agentColor(agent){ return AGENT_COLOR[agent] || '#66788c'; }

  // shadeColor lightens (percent>0) or darkens (percent<0) a hex colour by
  // percent toward white/black: UI review patch section 2, "shade per
  // session inside a harness" so two sessions of the same harness stack
  // distinguishably in the burn chart without a whole new colour per session.
  function shadeColor(hex, percent){
    hex = hex.replace('#', '');
    var num = parseInt(hex, 16);
    var r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
    var target = percent < 0 ? 0 : 255;
    var p = Math.abs(percent);
    function adj(c){ return Math.round((target - c) * p + c); }
    r = adj(r); g = adj(g); b = adj(b);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  var SHADE_OFFSETS = [0, -0.22, 0.22, -0.4, 0.4, -0.55, 0.55];

  var REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // animateNumber (token-monitor's own recipe, reimplemented): one RAF tween
  // per element, easeOutQuart, cancelling any tween already running on that
  // element so a fast poll cadence never lets an old loop overwrite a
  // newer value. State (_animVal, _animRAF) lives on the element itself, so
  // callers must reuse the same DOM node across polls rather than
  // rebuilding it each time (see ensureVendorRow).
  function animateNumber(el, newVal, duration, formatFn){
    if(!el || newVal == null) return;
    if(REDUCED_MOTION){
      el.textContent = formatFn(newVal);
      el._animVal = newVal;
      return;
    }
    var from = el._animVal != null ? el._animVal : newVal;
    if(el._animRAF) cancelAnimationFrame(el._animRAF);
    if(from === newVal){ el.textContent = formatFn(newVal); el._animVal = newVal; return; }
    var start = performance.now();
    function tick(now){
      var t = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - t, 4);
      var val = from + (newVal - from) * eased;
      el.textContent = formatFn(val);
      if(t < 1){
        el._animRAF = requestAnimationFrame(tick);
      } else {
        el._animVal = newVal;
        el._animRAF = null;
      }
    }
    el._animRAF = requestAnimationFrame(tick);
  }

  function fmtTokens(n){
    if(n == null) return '-';
    if(n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if(n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(n);
  }
  function fmtCost(c){ return '$' + (c || 0).toFixed(2); }

  function fmtBytes(bps){
    if(bps == null) return '-';
    var units = ['B/s','KB/s','MB/s','GB/s'];
    var v = bps, i = 0;
    while(v >= 1024 && i < units.length - 1){ v /= 1024; i++; }
    return v.toFixed(v < 10 ? 1 : 0) + ' ' + units[i];
  }
  function fmtBytesPlain(n){
    if(n == null) return '-';
    var units = ['B','KB','MB'];
    var v = n, i = 0;
    while(v >= 1024 && i < units.length - 1){ v /= 1024; i++; }
    return v.toFixed(v < 10 && i > 0 ? 1 : 0) + ' ' + units[i];
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // pad2/fmtHMS/fmtHM: 24-hour time everywhere, no AM/PM anywhere (decision
  // taken with Wilco). toLocaleTimeString on this laptop's own locale would
  // print 12-hour AM/PM, so every clock/timestamp on this page formats its
  // own local time instead of relying on it.
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function fmtHMS(d){ return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }
  function fmtHM(d){ return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

  function renderClock(){
    var el = document.getElementById('hdrClock');
    if(el) el.textContent = fmtHMS(new Date());
  }

  // agentBySessionMap must cover every session_id the chart's by_session
  // buckets can name, not just the top-level running sessions: a session
  // that stopped within the 30-min chart window is gone from snap.sessions
  // but still has bars, and a subagent never appears at the top level at
  // all (it nests under its parent's Subagents). Walking sessions
  // recursively covers the first case only while it is still running;
  // snap.turns (every real turn in the chart window, running or not) is
  // the fallback that covers both, so it is applied first and the
  // recursive walk fills in anything turns missed (e.g. a session with no
  // turn yet).
  function agentBySessionMap(sessions, turns){
    var m = {};
    (turns || []).forEach(function(t){ m[t.session_id] = t.agent; });
    (function walk(list){
      (list || []).forEach(function(s){
        m[s.session_id] = s.agent;
        walk(s.subagents);
      });
    })(sessions);
    return m;
  }

  // renderBars (section 2): bars per session per time bucket, stacked,
  // coloured by harness with a shade per session inside that harness.
  // Rebuilt wholesale on every refresh (decision: "rebuilt on every
  // refresh"). The CPU line overlay is gone (decision: "bars only").
  function renderBars(chart, agentBySession){
    var el = document.getElementById('burnBars');
    if(!el) return;
    chart = chart || [];

    var byHarness = {};
    chart.forEach(function(bucket){
      var bySession = bucket.by_session || {};
      Object.keys(bySession).forEach(function(sid){
        var agent = agentBySession[sid] || 'other';
        var list = byHarness[agent] || (byHarness[agent] = []);
        if(list.indexOf(sid) === -1) list.push(sid);
      });
    });
    // shadeOf and rankOf are both built from the same harness-then-session
    // ordering, so segments of the same harness stay adjacent within a bar
    // (rankOf) and get visibly distinct shades in that same order (shadeOf)
    // rather than an unrelated alphabetical-by-session-id order interleaving
    // different harnesses' segments (found by review, 2026-09-25).
    var shadeOf = {}, rankOf = {}, rank = 0;
    AGENT_ORDER.concat(Object.keys(byHarness).filter(function(a){ return AGENT_ORDER.indexOf(a) === -1; }))
      .forEach(function(agent){
        var sids = (byHarness[agent] || []).slice().sort();
        sids.forEach(function(sid, i){
          shadeOf[sid] = shadeColor(agentColor(agent), SHADE_OFFSETS[i % SHADE_OFFSETS.length]);
          rankOf[sid] = rank++;
        });
      });

    var perBucket = chart.map(function(bucket){
      var bySession = bucket.by_session || {};
      return Object.keys(bySession).map(function(sid){
        var c = bySession[sid];
        var tok = (c.fresh || 0) + (c.cache_write || 0) + (c.cache_read || 0) + (c.output || 0);
        return { sid: sid, tok: tok, agent: agentBySession[sid] || 'other' };
      }).filter(function(s){ return s.tok > 0; }).sort(function(a, b){ return rankOf[a.sid] - rankOf[b.sid]; });
    });
    var max = 1;
    perBucket.forEach(function(list){
      var sum = list.reduce(function(a, s){ return a + s.tok; }, 0);
      if(sum > max) max = sum;
    });

    var html = '';
    perBucket.forEach(function(list){
      html += '<div class="bar">';
      list.forEach(function(s){
        var pct = 100 * s.tok / max;
        pct = Math.max(pct, 1.5); // a real but tiny bucket still shows a sliver
        html += '<i style="height:' + pct.toFixed(1) + '%;background:' + (shadeOf[s.sid] || agentColor(s.agent)) + '"></i>';
      });
      html += '</div>';
    });
    // The overlay SVG (turn markers) is a fixed child of #burnBars; rebuild
    // everything else around it rather than wiping it out with innerHTML.
    var overlay = document.getElementById('turnMarkers');
    el.innerHTML = html;
    if(overlay) el.appendChild(overlay);
  }

  // renderBurnAxis draws the x-axis labels every 5 minutes (section 2),
  // aligned one label slot per chart bucket so it never drifts out of sync
  // with the bars above it. Chart always has a full window's worth of
  // buckets even with no sessions running (live.buildChart's own "every
  // slot present" contract), so the axis still draws with nothing to show
  // above it (section 2: "with no sessions, still draw the empty axis").
  function renderBurnAxis(chart, bucketSeconds){
    var axisEl = document.getElementById('burnAxis');
    if(!axisEl) return;
    if(!chart || !chart.length){ axisEl.innerHTML = ''; return; }
    var everyN = Math.max(1, Math.round(300 / (bucketSeconds || 60)));
    var html = '';
    chart.forEach(function(bucket, i){
      var label = '';
      if(i % everyN === 0) label = fmtHM(new Date(bucket.at));
      html += '<div class="axistick">' + label + '</div>';
    });
    axisEl.innerHTML = html;
  }

  // renderTurnMarkers draws one small tick per turn at its real position in
  // the 30-minute window (design doc: "agent turns as markers on the
  // system charts"), interpolated linearly between the chart's first and
  // last bucket timestamps rather than snapped to the nearest bucket, so a
  // burst of turns inside one bucket still spreads out left-to-right. A
  // turn with a finding (insight.Finding) draws taller and in that
  // finding's own tag colour; a plain turn draws short and dim. Kept per
  // the UI review patch's own decision ("keep the turn markers").
  var FINDING_MARKER_COLOR = {
    'expensive-turn': '#ff4b4b', 'context-runway': '#ffd75f',
    're-prefill': '#38d3e3', 'compaction': '#d68cf0'
  };
  function renderTurnMarkers(turns, chart){
    var svg = document.getElementById('turnMarkers');
    if(!svg) return;
    if(!chart || chart.length < 2 || !turns || !turns.length){ svg.innerHTML = ''; return; }
    var t0 = new Date(chart[0].at).getTime();
    var t1 = new Date(chart[chart.length - 1].at).getTime();
    if(t1 <= t0){ svg.innerHTML = ''; return; }
    var html = '';
    turns.forEach(function(t){
      var x = 100 * (new Date(t.at).getTime() - t0) / (t1 - t0);
      if(x < 0 || x > 100) return;
      var color = t.finding ? (FINDING_MARKER_COLOR[t.finding.Kind] || '#ffa028') : 'rgba(255,255,255,.25)';
      var y2 = t.finding ? 100 : 12;
      html += '<line x1="' + x.toFixed(1) + '" y1="0" x2="' + x.toFixed(1) + '" y2="' + y2 +
        '" stroke="' + color + '" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    });
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.innerHTML = html;
  }

  function renderSessionCards(sessions){
    var el = document.getElementById('sessionCards');
    if(!el) return;
    var html = '';
    (sessions || []).forEach(function(s){
      var pct = s.context_window > 0 ? Math.min(100, 100 * s.context / s.context_window) : 0;
      html += '<div class="card">' +
        '<h4 style="color:' + agentColor(s.agent) + '">' + (s.agent || s.vendor) + '</h4>' +
        '<div class="ctxbar"><i style="width:' + pct.toFixed(0) + '%;background:' + agentColor(s.agent) + '"></i></div>' +
        '<small>turn ' + s.turn_count + ' &middot; ' + fmtTokens(s.tokens) + ' tok &middot; ' + fmtCost(s.cost) + '</small>' +
        '</div>';
    });
    el.innerHTML = html || '<div class="placeholder" style="flex:0 0 auto;padding:10px">No sessions running</div>';
  }

  // Vendor strip rows are created once per agent and updated in place on
  // every poll (rather than rebuilt via innerHTML), so animateNumber's
  // per-element tween state survives across polls and a row's expanded
  // cache-breakdown detail is not wiped out from under an open click.
  var vendorRowEls = {};
  var expandedVendor = null;
  var expandRowEl = null;

  function collapseVendorExpand(){
    if(expandRowEl){ expandRowEl.remove(); expandRowEl = null; }
    expandedVendor = null;
  }

  function toggleVendorExpand(agent){
    if(expandedVendor === agent){ collapseVendorExpand(); return; }
    collapseVendorExpand();
    var rec = vendorRowEls[agent];
    if(!rec) return;
    expandedVendor = agent;
    var tr = document.createElement('tr');
    tr.className = 'vexpand';
    var td = document.createElement('td');
    td.colSpan = 4;
    td.textContent = 'Loading cache breakdown…';
    tr.appendChild(td);
    rec.tr.parentNode.insertBefore(tr, rec.tr.nextSibling);
    expandRowEl = tr;
    if(!window.bdevCacheBreakdown) return;
    window.bdevCacheBreakdown(agent).then(function(t){
      if(expandedVendor !== agent) return; // collapsed, or another row opened, while this was in flight
      t = t || {};
      var miss = (t.fresh || 0) + (t.cache_w || 0);
      var hit = t.cache_r || 0;
      var denom = miss + hit;
      var rate = denom > 0 ? (100 * hit / denom) : 0;
      td.innerHTML = 'Input today: <b>' + fmtTokens(miss) + '</b> miss / <b style="color:var(--grn)">' +
        fmtTokens(hit) + '</b> hit &middot; Output: <b>' + fmtTokens(t.out || 0) +
        '</b> &middot; Hit rate: <b>' + rate.toFixed(0) + '%</b>';
    }).catch(function(err){
      console.error('bdevCacheBreakdown failed', err);
      if(expandedVendor === agent) td.textContent = 'Cache breakdown unavailable';
    });
  }

  function ensureVendorRow(tbody, agent, label){
    var rec = vendorRowEls[agent];
    if(rec) return rec;
    var tr = document.createElement('tr');
    tr.className = 'vrow';
    var tdName = document.createElement('td');
    tdName.innerHTML = '<span class="dot" style="background:' + agentColor(agent) + '"></span>' + label;
    var tdToday = document.createElement('td'); tdToday.className = 'num';
    var tdWeek = document.createElement('td'); tdWeek.className = 'num';
    var tdMonth = document.createElement('td'); tdMonth.className = 'num';
    tr.appendChild(tdName); tr.appendChild(tdToday); tr.appendChild(tdWeek); tr.appendChild(tdMonth);
    tr.addEventListener('click', function(){ toggleVendorExpand(agent); });
    tbody.appendChild(tr);
    rec = { tr: tr, today: tdToday, week: tdWeek, month: tdMonth };
    vendorRowEls[agent] = rec;
    return rec;
  }

  // renderTotalRow (section 3): bold totals row, pinned to the top of the
  // vendor strip table, created once and updated in place like the other
  // rows.
  var totalRowEls = null;
  function ensureTotalRow(tbody){
    if(totalRowEls) return totalRowEls;
    var tr = document.createElement('tr');
    tr.className = 'totalrow';
    var tdName = document.createElement('td'); tdName.textContent = 'Total';
    var tdToday = document.createElement('td'); tdToday.className = 'num';
    var tdWeek = document.createElement('td'); tdWeek.className = 'num';
    var tdMonth = document.createElement('td'); tdMonth.className = 'num';
    tr.appendChild(tdName); tr.appendChild(tdToday); tr.appendChild(tdWeek); tr.appendChild(tdMonth);
    tbody.appendChild(tr);
    totalRowEls = { tr: tr, today: tdToday, week: tdWeek, month: tdMonth };
    return totalRowEls;
  }

  function renderVendorStrip(payload){
    var tbody = document.getElementById('vendorStrip');
    if(!tbody) return;
    var rows = (payload && payload.rows) || [];
    var seen = {};
    rows.forEach(function(r){
      seen[r.agent] = true;
      var rec = ensureVendorRow(tbody, r.agent, r.agent_label);
      animateNumber(rec.today, r.today, 400, fmtTokens);
      animateNumber(rec.week, r.week, 400, fmtTokens);
      animateNumber(rec.month, r.month, 400, fmtTokens);
    });
    Object.keys(vendorRowEls).forEach(function(agent){
      if(seen[agent]) return;
      if(expandedVendor === agent) collapseVendorExpand();
      vendorRowEls[agent].tr.remove();
      delete vendorRowEls[agent];
    });
    // Totals row goes to the top of the table (section 3), bold, kept in
    // sync with the same tween the per-vendor rows use.
    var total = ensureTotalRow(tbody);
    tbody.insertBefore(total.tr, tbody.firstChild);
    animateNumber(total.today, (payload && payload.total && payload.total.today) || 0, 400, fmtTokens);
    animateNumber(total.week, (payload && payload.total && payload.total.week) || 0, 400, fmtTokens);
    animateNumber(total.month, (payload && payload.total && payload.total.month) || 0, 400, fmtTokens);
  }

  function renderHeadline(total){
    total = total || {};
    animateNumber(document.getElementById('hlToday'), total.today || 0, 1000, fmtTokens);
  }

  var MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function mondayOnOrBefore(d){
    var m = new Date(d.getTime());
    var diff = (d.getUTCDay() + 6) % 7; // 0=Monday .. 6=Sunday
    m.setUTCDate(d.getUTCDate() - diff);
    return m;
  }

  // renderHeatmap lays internal/history's own per-day rows out as a
  // GitHub-style grid: Monday-start weeks (this codebase's own ISO-week
  // convention, used elsewhere for the same "week" concept), one column
  // per week, oldest first, 182 days (26 weeks) ending today.
  function renderHeatmap(payload){
    var grid = document.getElementById('heatmapGrid');
    var activeEl = document.getElementById('heatmapActiveDays');
    if(!grid) return;
    var byDate = {};
    ((payload && payload.rows) || []).forEach(function(r){ byDate[r.key] = r; });

    var now = new Date();
    var today = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
    var start = new Date(today.getTime());
    start.setUTCDate(start.getUTCDate() - 181);
    var gridStart = mondayOnOrBefore(start);
    var weeks = Math.floor((today.getTime() - gridStart.getTime()) / 604800000) + 1;

    var cols = [];
    var activeDays = 0;
    for(var w = 0; w < weeks; w++){
      var col = [];
      for(var d = 0; d < 7; d++){
        var day = new Date(gridStart.getTime());
        day.setUTCDate(gridStart.getUTCDate() + w * 7 + d);
        if(day < start || day > today){ col.push(null); continue; }
        var key = day.toISOString().slice(0, 10);
        var row = byDate[key];
        var tokens = row ? row.tokens : 0;
        var cost = row && row.cost_usd != null ? row.cost_usd : null;
        if(tokens > 0) activeDays++;
        col.push({ date: key, tokens: tokens, cost: cost });
      }
      cols.push(col);
    }

    var max = 1;
    cols.forEach(function(col){ col.forEach(function(c){ if(c && c.tokens > max) max = c.tokens; }); });

    var html = '<div class="heatgrid">';
    cols.forEach(function(col){
      html += '<div class="heatcol">';
      col.forEach(function(c){
        if(!c){ html += '<i class="heatcell empty"></i>'; return; }
        var active = c.tokens > 0;
        var op = active ? (0.15 + 0.85 * Math.min(1, c.tokens / max)) : 0;
        var title = c.date + ': ' + fmtTokens(c.tokens) + ' tok' + (c.cost != null ? ', ' + fmtCost(c.cost) : '');
        html += '<i class="heatcell' + (active ? ' active' : '') + '" style="opacity:' + op.toFixed(2) + '" title="' + title + '"></i>';
      });
      html += '</div>';
    });
    html += '</div><div class="heatmonths">';
    var lastMonth = null;
    cols.forEach(function(col){
      var first = null;
      for(var i = 0; i < col.length; i++){ if(col[i]){ first = col[i]; break; } }
      var m = first ? new Date(first.date + 'T00:00:00Z').getUTCMonth() : null;
      var label = (m !== null && m !== lastMonth) ? MONTH_ABBR[m] : '';
      if(m !== null) lastMonth = m;
      html += '<div class="heatmonth">' + label + '</div>';
    });
    html += '</div>';
    grid.innerHTML = html;
    if(activeEl) activeEl.textContent = activeDays + ' active days';
  }

  // renderTicker (section 5): one dense line per turn, newest first, capped
  // at 50, click opens the turn detail popup.
  function renderTicker(turns){
    var el = document.getElementById('turnTicker');
    if(!el) return;
    var html = '';
    (turns || []).slice(0, 50).forEach(function(t){
      var time = fmtHMS(new Date(t.at));
      var tag = '';
      if(t.finding){
        tag = '<span class="tag">' + esc(t.finding.Kind) + '</span>';
      }
      var tok = (t.fresh || 0) + (t.cache_write || 0) + (t.cache_read || 0) + (t.output || 0);
      html += '<div class="trow clickable" data-session="' + esc(t.session_id) + '" data-turn="' + t.turn + '">' +
        '<span class="t">' + time + '</span>' +
        '<span class="h" style="color:' + agentColor(t.agent) + '">' + esc(t.agent) + '</span>' +
        tag +
        '<span class="m">' + fmtTokens(tok) + ' tok</span></div>';
    });
    el.innerHTML = html || '<div class="placeholder" style="padding:10px">No turns in the last 30 minutes</div>';
  }

  // ---------- Turn detail popup (section 5) ----------
  // Keyed by "sessionID:turn" since a fast second click before the first
  // resolves can have more than one bdevTurnDetail call in flight.
  // currentTurnKey additionally guards against a stale response actually
  // being drawn once it lands: click turn A then turn B before A resolves,
  // and without this check A's later resolve would overwrite B's already
  // -rendered content (found by review, 2026-09-25; the keyed-pending map
  // alone only routes each response to its own call, it does not stop an
  // old one from still painting after a newer click has moved on).
  var TURN_DETAIL_PENDING = {};
  var currentTurnKey = null;
  window.__bdevTurnDetailResolve = function(key, detail){
    var p = TURN_DETAIL_PENDING[key];
    if(p){ delete TURN_DETAIL_PENDING[key]; p.resolve(detail); }
  };

  function openTurnPopup(sessionID, turn){
    var overlay = document.getElementById('turnPopupOverlay');
    var body = document.getElementById('turnPopupBody');
    if(!overlay || !body || !sessionID || !turn) return;
    overlay.classList.remove('hidden');
    var key = sessionID + ':' + turn;
    currentTurnKey = key;
    if(typeof window.bdevTurnDetail !== 'function'){
      body.innerHTML = '<p>Turn detail is not available.</p>';
      return;
    }
    body.innerHTML = '<p>Loading turn detail&hellip;</p>';
    new Promise(function(resolve){
      TURN_DETAIL_PENDING[key] = { resolve: resolve };
      window.bdevTurnDetail(sessionID, turn);
    }).then(function(d){
      if(currentTurnKey !== key) return; // superseded by a later click
      if(d && d.error){
        body.innerHTML = '<p>Could not load turn detail: ' + esc(d.error) + '</p>';
        return;
      }
      renderTurnPopup(d);
    }).catch(function(e){
      if(currentTurnKey !== key) return;
      body.innerHTML = '<p>Could not load turn detail: ' + esc(e && e.message ? e.message : String(e)) + '</p>';
    });
  }

  function closeTurnPopup(){
    var overlay = document.getElementById('turnPopupOverlay');
    if(overlay) overlay.classList.add('hidden');
    currentTurnKey = null;
  }

  // renderTurnPopup: model, token split, cache hit, cost, tools, findings
  // (section 5), the burnmon-dev equivalent of burnmon.exe's own turn
  // drawer (internal/report/template.html's renderTurnDrawer), restyled to
  // this page's dark amber theme rather than ported verbatim.
  function renderTurnPopup(d){
    var body = document.getElementById('turnPopupBody');
    if(!body || !d) return;

    var gapText = d.has_gap ? (Math.round(d.gap_seconds) + 's since the previous turn') : 'first turn seen for this session';
    var miss = (d.fresh || 0) + (d.cache_write || 0);
    var hit = d.cache_read || 0;
    var hitRate = (miss + hit) > 0 ? (100 * hit / (miss + hit)) : 0;

    var findingsHtml = (d.findings && d.findings.length)
      ? d.findings.map(function(f){
          return '<div>' + esc(f.Kind) + ', confidence ' + Math.round((f.Confidence || 0) * 100) +
            '%: ' + esc(f.Cause) + '</div>';
        }).join('')
      : '<div class="dim">No findings on this turn.</div>';

    var toolRows = (d.tool_calls || []).map(function(c){
      return '<tr><td>' + esc(c.tool) + '</td><td>' + esc(c.path || '') + '</td>' +
        '<td class="num">' + fmtTokens(c.input_bytes) + '</td><td class="num">' +
        (c.result_bytes != null ? fmtTokens(c.result_bytes) : '') + '</td></tr>';
    }).join('');
    var toolCallsHtml = toolRows
      ? '<table><thead><tr><th>Tool</th><th>Path</th><th>In</th><th>Out</th></tr></thead><tbody>' + toolRows + '</tbody></table>'
      : '<div class="dim">No tool calls recorded for this turn.</div>';

    var filesHtml = (d.files && d.files.length)
      ? '<ul class="tight">' + d.files.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>'
      : '<div class="dim">No files recorded for this turn.</div>';

    body.innerHTML =
      '<h3>Turn ' + d.turn + '</h3>' +
      '<div class="dim">Session ' + esc(d.session_id) + ' &middot; ' + esc(d.model || 'model unknown') + '</div>' +
      '<div class="dim">' + fmtHMS(new Date(d.at)) + ' &middot; ' + esc(gapText) + ' &middot; ' + fmtCost(d.cost) + '</div>' +
      '<h4>Token classes</h4>' +
      '<div>fresh ' + fmtTokens(d.fresh) + ', cache write ' + fmtTokens(d.cache_write) +
        ', cache read ' + fmtTokens(d.cache_read) + ' (' + hitRate.toFixed(0) + '% hit), output ' + fmtTokens(d.output) + '</div>' +
      '<h4>Findings</h4>' + findingsHtml +
      '<h4>Tool calls this turn</h4>' + toolCallsHtml +
      '<h4>Files read</h4>' + filesHtml;
  }

  document.addEventListener('click', function(e){
    var line = e.target && e.target.closest && e.target.closest('.trow.clickable');
    if(line) openTurnPopup(line.getAttribute('data-session'), parseInt(line.getAttribute('data-turn'), 10));
  });
  document.getElementById('turnPopupClose').addEventListener('click', closeTurnPopup);
  document.getElementById('turnPopupOverlay').addEventListener('click', function(e){
    if(e.target === this) closeTurnPopup();
  });
  // Window, section 10: Esc also leaves fullscreen. F11 itself is not
  // handled here: WebView2/Chromium reserves it as a default browser
  // accelerator key and never lets the page's own keydown listener see it
  // at all (confirmed empirically), so the Go side catches it directly with
  // a global hotkey instead (installF11Hotkey, windowstate.go) rather than
  // through this page. An open turn popup takes priority on Esc (closes the
  // popup, does not also exit fullscreen in the same keypress);
  // bdevExitFullscreen is always safe to call regardless, since it no-ops
  // when the window is not fullscreen.
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape' && e.key !== 'Esc') return;
    var overlay = document.getElementById('turnPopupOverlay');
    if(overlay && !overlay.classList.contains('hidden')){
      closeTurnPopup();
      return;
    }
    if(window.bdevExitFullscreen) window.bdevExitFullscreen();
  });

  var lastSysmonHistory = [];

  // recentBuckets returns the chart's last N seconds' worth of buckets,
  // for a rate that reflects a short trailing window rather than only the
  // current, still-filling bucket (which reads low right after a bucket
  // boundary and would otherwise make both the $/min chip and tok/min jump
  // every tick).
  function recentBuckets(chart, seconds, bucketSeconds){
    var n = Math.max(1, Math.round(seconds / Math.max(bucketSeconds, 1)));
    return chart.slice(-n);
  }

  function renderHeaderBurn(snap){
    var sessionsEl = document.getElementById('hdrSessions');
    if(sessionsEl) sessionsEl.textContent = (snap.sessions || []).length + ' sessions';
    var chart = snap.chart || [];
    var bucketSeconds = snap.bucket_seconds || 60;
    var recent = recentBuckets(chart, 300, bucketSeconds);
    var minutes = recent.length * bucketSeconds / 60;

    var rateEl = document.getElementById('hdrBurnRate');
    if(rateEl){
      var cost = recent.reduce(function(sum, b){ return sum + (b.cost || 0); }, 0);
      rateEl.textContent = (minutes > 0 ? cost / minutes : 0).toFixed(2);
    }

    var tokMinEl = document.getElementById('hdrTokMin');
    if(tokMinEl){
      var tokens = 0;
      recent.forEach(function(bucket){
        var bySession = bucket.by_session || {};
        Object.keys(bySession).forEach(function(sid){
          var c = bySession[sid];
          tokens += (c.fresh || 0) + (c.cache_write || 0) + (c.cache_read || 0) + (c.output || 0);
        });
      });
      tokMinEl.textContent = fmtTokens(minutes > 0 ? tokens / minutes : 0);
    }
  }

  function pollBurn(){
    if(!window.bdevBurnNow) return Promise.resolve();
    return window.bdevBurnNow().then(function(snap){
      if(!snap) return;
      var agentBySession = agentBySessionMap(snap.sessions, snap.turns);
      renderBars(snap.chart, agentBySession);
      renderBurnAxis(snap.chart, snap.bucket_seconds);
      renderTurnMarkers(snap.turns, snap.chart);
      renderSessionCards(snap.sessions);
      renderTicker(snap.turns);
      renderHeaderBurn(snap);
    }).catch(function(err){ console.error('bdevBurnNow failed', err); });
  }

  function pollVendorStrip(){
    if(!window.bdevVendorStrip) return Promise.resolve();
    return window.bdevVendorStrip().then(function(payload){
      renderVendorStrip(payload);
      renderHeadline(payload && payload.total);
    }).catch(function(err){ console.error('bdevVendorStrip failed', err); });
  }

  // bdevActivityHeatmap returns immediately (its real work runs off the
  // Go side's UI thread, see main.go's own comment) and delivers its
  // result through this resolver instead of the call's own Promise, which
  // would just resolve with undefined. A 182-day scan is not something to
  // run on bdevBurnNow's 2s cadence either, so this polls at the same
  // 1-minute cadence as the vendor strip: "today"'s heatmap cell can lag
  // up to a minute.
  window.__bdevActivityHeatmapResolve = renderHeatmap;

  function pollActivityHeatmap(){
    if(!window.bdevActivityHeatmap) return;
    window.bdevActivityHeatmap();
  }

  function pollSysmonHistory(){
    if(!window.bdevSysmonHistory) return Promise.resolve();
    return window.bdevSysmonHistory(1800).then(function(history){
      lastSysmonHistory = history || [];
      renderHistoryChart(lastSysmonHistory);
    }).catch(function(err){ console.error('bdevSysmonHistory failed', err); });
  }

  function renderPressureChip(score){
    var el = document.getElementById('pressureChip');
    if(!el) return;
    el.textContent = 'PRESSURE ' + score;
    var color = score < 45 ? 'var(--grn)' : score < 75 ? 'var(--yel)' : 'var(--red)';
    el.style.color = color;
  }

  // ---------- System panel (section 6): perfadvisor layout ----------

  function renderCPUBox(sm){
    var threadsEl = document.getElementById('cpuThreads');
    if(threadsEl) threadsEl.textContent = (sm.Cores || []).length;
    var pct = Math.round(sm.CPUPct || 0);
    var bar = document.getElementById('cpuTotalBar');
    if(bar) bar.style.width = Math.min(100, pct) + '%';
    var lbl = document.getElementById('cpuTotal');
    if(lbl) lbl.textContent = pct + '%';
    var metaEl = document.getElementById('cpuBaseClock');
    if(metaEl) metaEl.textContent = sm.base_clock_ghz > 0 ? 'base ' + sm.base_clock_ghz.toFixed(1) + ' GHz' : '';

    var grid = document.getElementById('coreGrid');
    if(grid){
      var html = '';
      (sm.Cores || []).forEach(function(v, i){
        var color = v < 45 ? 'var(--grn)' : v < 75 ? 'var(--yel)' : 'var(--red)';
        html += '<div class="coreitem"><span class="corelabel">C' + i + '</span>' +
          '<div class="corebar"><i style="width:' + Math.min(100, v).toFixed(0) + '%;background:' + color + '"></i></div>' +
          '<span class="corelabel">' + Math.round(v) + '%</span></div>';
      });
      grid.innerHTML = html;
    }
  }

  // renderHistoryChart draws cpu/ram/disk/net/gpu as smooth canvas lines,
  // newest sample on the right (section 6). cpu/ram/gpu already share a
  // natural 0-100 percent scale; disk and net (bytes/sec, no fixed
  // ceiling) are each scaled to their own peak within the visible window,
  // per the reference panel's own "disk and net scaled to own peak" note.
  var HIST_SERIES = [
    { key: 'CPUPct', label: 'cpu', color: '#00d26a', fmt: function(v){ return Math.round(v) + '%'; } },
    { key: 'ram', label: 'ram', color: '#4da6ff', fmt: function(v){ return Math.round(v) + '%'; } },
    { key: 'DiskReadBps', key2: 'DiskWriteBps', label: 'disk', color: '#ffd75f', ownPeak: true, fmt: fmtBytes },
    { key: 'NetDownBps', key2: 'NetUpBps', label: 'net', color: '#d68cf0', ownPeak: true, fmt: fmtBytes },
    { key: 'GPUPct', label: 'gpu', color: '#ff4b4b', fmt: function(v){ return Math.round(v) + '%'; } }
  ];
  function seriesValue(s, def){
    var v = def.key2 != null ? (s[def.key] || 0) + (s[def.key2] || 0) : s[def.key];
    return v == null || v < 0 ? 0 : v;
  }
  function renderHistoryChart(history){
    var canvas = document.getElementById('histCanvas');
    var legend = document.getElementById('histLegend');
    if(!canvas || !legend) return;
    var wrap = canvas.parentElement;
    var w = wrap.clientWidth, h = wrap.clientHeight;
    if(w <= 0 || h <= 0) return;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr; canvas.height = h * dpr;
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var samples = (history || []).map(function(s){
      return { CPUPct: s.CPUPct, ram: s.MemTotalMB > 0 ? 100 * s.MemUsedMB / s.MemTotalMB : 0,
        DiskReadBps: s.DiskReadBps, DiskWriteBps: s.DiskWriteBps,
        NetDownBps: s.NetDownBps, NetUpBps: s.NetUpBps, GPUPct: s.GPUPct };
    });

    var legendHtml = '';
    if(!samples.length){
      legend.innerHTML = '<span class="dim">No system history yet</span>';
      return;
    }
    HIST_SERIES.forEach(function(def){
      var vals = samples.map(function(s){ return seriesValue(s, def); });
      var peak = def.ownPeak ? Math.max.apply(null, vals.concat([1])) : 100;
      ctx.beginPath();
      vals.forEach(function(v, i){
        var x = vals.length > 1 ? (i / (vals.length - 1)) * w : 0;
        var y = h - Math.min(1, v / peak) * h;
        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = def.color;
      ctx.lineWidth = 1.4;
      ctx.stroke();
      var current = vals[vals.length - 1];
      legendHtml += '<span><span class="dot" style="background:' + def.color + '"></span>' + def.label + ' <b>' + def.fmt(current) + '</b></span>';
    });
    legendHtml += '<span class="note">disk and net scaled to own peak</span>';
    legend.innerHTML = legendHtml;
  }

  function renderMemoryBox(sm){
    var bar = document.querySelector('#boxMemory .sysbar i');
    var pct = sm.MemTotalMB > 0 ? 100 * sm.MemUsedMB / sm.MemTotalMB : 0;
    if(bar) bar.style.width = Math.min(100, pct).toFixed(0) + '%';
    var l1 = document.getElementById('memLine1');
    if(l1) l1.innerHTML = pct.toFixed(0) + '% &middot; <b>' + (sm.MemUsedMB / 1024).toFixed(1) + '</b> / ' + (sm.MemTotalMB / 1024).toFixed(1) + ' GB used';
    var l2 = document.getElementById('memLine2');
    if(l2) l2.textContent = ((sm.MemTotalMB - sm.MemUsedMB) / 1024).toFixed(1) + ' GB available';
    var l3 = document.getElementById('memLine3');
    if(l3){
      l3.textContent = sm.SwapTotalMB > 0
        ? 'swap ' + (sm.SwapUsedMB / 1024).toFixed(1) + ' / ' + (sm.SwapTotalMB / 1024).toFixed(1) + ' GB'
        : 'no swap';
    }
  }

  function renderDisksBox(sm){
    var el = document.getElementById('disksBody');
    if(!el) return;
    var disks = sm.Disks || [];
    if(!disks.length){ el.innerHTML = '<div class="dim">No drives read</div>'; return; }
    var html = '';
    disks.forEach(function(d){
      html += '<div class="line">' + esc(d.Mount) + ' <b>' + Math.round(d.UsedPercent) + '%</b></div>' +
        '<div class="sysbar"><i style="width:' + Math.min(100, d.UsedPercent).toFixed(0) + '%;background:var(--yel)"></i></div>' +
        '<div class="line dim">' + d.FreeGB.toFixed(0) + 'G free &middot; R ' + fmtBytes(d.ReadBps) + ', W ' + fmtBytes(d.WriteBps) + '</div>';
    });
    el.innerHTML = html;
  }

  function renderNetworkBox(sm){
    var down = document.getElementById('netDown');
    if(down) down.innerHTML = 'down <b>' + fmtBytes(sm.NetDownBps) + '</b>';
    var up = document.getElementById('netUp');
    if(up) up.innerHTML = 'up <b>' + fmtBytes(sm.NetUpBps) + '</b>';
    var wifi = document.getElementById('netWifi');
    if(wifi){
      var w = sm.Wifi || {};
      wifi.textContent = w.OK && w.Connected ? (w.SSID + ' · signal ' + w.SignalPct + '%') : (w.OK ? 'wifi disconnected' : '');
    }
  }

  function poll(){
    if(!window.bdevSysmonNow){ return Promise.resolve(); }
    return window.bdevSysmonNow().then(function(sm){
      if(!sm) return;
      var hdrCPU = document.getElementById('hdrCPU');
      if(hdrCPU) hdrCPU.textContent = Math.round(sm.CPUPct) + '%';
      var hdrRAM = document.getElementById('hdrRAM');
      if(hdrRAM && sm.MemTotalMB > 0) hdrRAM.textContent = Math.round(100 * sm.MemUsedMB / sm.MemTotalMB) + '%';
      renderCPUBox(sm);
      renderMemoryBox(sm);
      renderDisksBox(sm);
      renderNetworkBox(sm);
      renderPressureChip(sm.pressure_score);
    }).catch(function(err){ console.error('bdevSysmonNow failed', err); });
  }

  var HARNESS_LABEL = {
    'claude': 'Claude Code', 'claude-desktop': 'Claude Desktop', 'codex': 'Codex',
    'copilot-cli': 'Copilot CLI', 'copilot-vscode': 'Copilot (VS Code)', 'hermes': 'Hermes',
    'wsl': 'WSL', 'burnmon-dev': 'BurnMon Dev', 'node': 'node (unclassified)'
  };
  // internal/sysmon's Harness values are their own vocabulary ("claude",
  // not "claude-code"), separate from AGENT_COLOR above, which is keyed by
  // schema.Event.Agent (the burn side's own vocabulary); this table is
  // deliberately its own map rather than reusing AGENT_COLOR with the
  // wrong keys.
  var HARNESS_COLOR = {
    'claude': '#ffa028', 'claude-desktop': '#ffc46b', 'codex': '#4da6ff',
    'copilot-cli': '#38d3e3', 'copilot-vscode': '#38d3e3', 'hermes': '#d68cf0',
    'wsl': '#66788c', 'burnmon-dev': '#66788c', 'node': '#66788c'
  };
  function harnessColor(h){ return HARNESS_COLOR[h] || '#66788c'; }

  // renderProcessGroups (section 7): headers right-aligned like the numbers
  // (the shared `th` rule now does this by default), the trend column takes
  // all remaining width and its sparkline stretches to fill it (the
  // trendsvg width:100% viewBox below, plus the #processGroups td:last-child
  // CSS rule).
  function renderProcessGroups(now, historyRows){
    var tbody = document.getElementById('processGroups');
    if(!tbody) return;
    var byHarness = {};
    (historyRows || []).forEach(function(r){
      (byHarness[r.Harness] || (byHarness[r.Harness] = [])).push(r);
    });
    var order = (now || []).slice().sort(function(a, b){ return b.CPUPct - a.CPUPct; });
    var html = '';
    order.forEach(function(row){
      var series = (byHarness[row.Harness] || []).slice(-30);
      var maxCPU = series.reduce(function(m, r){ return Math.max(m, r.CPUPct); }, 1);
      var pts = series.map(function(r, i){
        var x = series.length > 1 ? (i / (series.length - 1)) * 100 : 0;
        var y = 12 - Math.min(12, 12 * r.CPUPct / maxCPU);
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
      html += '<tr><td><span class="dot" style="background:' + harnessColor(row.Harness) + '"></span>' +
        (HARNESS_LABEL[row.Harness] || row.Harness) + '</td>' +
        '<td class="num">' + row.CPUPct.toFixed(0) + '%</td>' +
        '<td class="num">' + (row.MemMB / 1024).toFixed(1) + 'G</td>' +
        '<td class="num">' + fmtBytes(row.IOBps) + '</td>' +
        '<td><svg class="trendsvg" viewBox="0 0 100 12" preserveAspectRatio="none">' +
        (pts ? '<polyline points="' + pts + '" fill="none" stroke="' + harnessColor(row.Harness) + '" stroke-width="1.2" vector-effect="non-scaling-stroke"/>' : '') +
        '</svg></td></tr>';
    });
    tbody.innerHTML = html || '<tr><td colspan="5" style="color:var(--dim);padding:8px">No classified processes yet</td></tr>';
  }

  // renderHarnessHeatmap buckets the same history rows into one-minute
  // columns per harness, CPU-weighted (design doc section 3): the sum of
  // every sample's CPUPct for that harness inside that minute, so a
  // harness with several processes each briefly busy still reads as a warm
  // cell rather than diluted by however many 2s ticks landed in it.
  function renderHarnessHeatmap(rows){
    var el = document.getElementById('harnessHeatmap');
    if(!el) return;
    if(!rows || !rows.length){ el.innerHTML = ''; return; }

    var byHarness = {};
    var minMin = Infinity, maxMin = -Infinity;
    rows.forEach(function(r){
      var minuteKey = Math.floor(new Date(r.Ts).getTime() / 60000);
      minMin = Math.min(minMin, minuteKey);
      maxMin = Math.max(maxMin, minuteKey);
      var byMin = (byHarness[r.Harness] || (byHarness[r.Harness] = {}));
      byMin[minuteKey] = (byMin[minuteKey] || 0) + r.CPUPct;
    });
    var harnesses = Object.keys(byHarness).sort(function(a, b){
      var sa = Object.values(byHarness[a]).reduce(function(x, y){ return x + y; }, 0);
      var sb = Object.values(byHarness[b]).reduce(function(x, y){ return x + y; }, 0);
      return sb - sa;
    });
    var max = 1;
    harnesses.forEach(function(h){
      Object.keys(byHarness[h]).forEach(function(m){ if(byHarness[h][m] > max) max = byHarness[h][m]; });
    });

    var html = '';
    harnesses.forEach(function(h){
      html += '<div class="heatrow"><span class="heatrow-label">' + (HARNESS_LABEL[h] || h) + '</span><span class="heatrow-cells">';
      for(var m = minMin; m <= maxMin; m++){
        var v = byHarness[h][m] || 0;
        var op = v > 0 ? (0.12 + 0.85 * Math.min(1, v / max)) : 0;
        html += '<i class="heatcell' + (v > 0 ? ' active' : '') + '" style="background:' + harnessColor(h) + ';opacity:' + op.toFixed(2) + '"></i>';
      }
      html += '</span></div>';
    });
    el.innerHTML = html;
  }

  window.__bdevExportResolve = function(result){
    var btn = document.getElementById('exportBtn');
    var status = document.getElementById('exportStatus');
    if(btn) btn.disabled = false;
    if(!status) return;
    if(!result || !result.ok){
      status.textContent = 'export failed' + (result && result.error ? ': ' + result.error : '');
      status.style.color = 'var(--red)';
      return;
    }
    status.textContent = 'exported ' + fmtBytesPlain(result.summary_bytes + result.data_json_bytes + result.daily_csv_bytes) +
      ' to ' + result.dir;
    status.style.color = 'var(--grn)';
  };

  function setupExportButton(){
    var btn = document.getElementById('exportBtn');
    if(!btn) return;
    btn.addEventListener('click', function(){
      if(!window.bdevExport) return;
      btn.disabled = true;
      var status = document.getElementById('exportStatus');
      if(status){ status.textContent = 'exporting...'; status.style.color = 'var(--dim)'; }
      window.bdevExport();
    });
  }

  function pollProcessGroups(){
    if(!window.bdevProcessGroupsNow || !window.bdevProcessGroupsHistory) return;
    Promise.all([window.bdevProcessGroupsNow(), window.bdevProcessGroupsHistory(60)])
      .then(function(results){
        var now = results[0], history = results[1];
        renderProcessGroups(now, history);
        renderHarnessHeatmap(history);
      })
      .catch(function(err){ console.error('process groups poll failed', err); });
  }

  // ---------- Microsoft To Do panel (section 9) ----------
  // Off unless burnmon-dev.json sets microsoft_todo_enabled; bdevTodoStatus
  // itself is cheap (one local file stat plus a bool), so it is fine to
  // poll it even while the panel stays hidden, the same way this page
  // already treats every other bdev* status call. todoState tracks what the
  // panel is currently showing so pollTodoStatus's own 30s poll never
  // clobbers an in-progress sign-in ("waiting for approval") with the plain
  // sign-in button again.
  var todoState = 'unknown'; // 'unknown' | 'signedout' | 'pending' | 'signedin'

  function renderTodoTasks(items){
    var body = document.getElementById('todoBody');
    if(!body) return;
    if(!items || !items.length){
      body.innerHTML = '<div class="placeholder" style="padding:10px">No tasks due today</div>';
      return;
    }
    var html = '';
    items.forEach(function(t){
      html += '<div class="todorow">' +
        '<span class="due' + (t.Overdue ? ' overdue' : '') + '">' + esc(t.DueDate || '') + '</span>' +
        '<span class="title">' + esc(t.Title) + '</span>' +
        '<span class="list">' + esc(t.List) + '</span></div>';
    });
    body.innerHTML = html;
  }

  window.__bdevTodoTasksResolve = function(payload){
    if(todoState !== 'signedin') return; // signed out or a sign-in retry raced this response
    var body = document.getElementById('todoBody');
    if(!body) return;
    if(payload && payload.error){
      body.innerHTML = '<div class="placeholder" style="padding:10px">Could not read tasks: ' + esc(payload.error) + '</div>';
      return;
    }
    renderTodoTasks(payload && payload.items);
  };

  function pollTodoTasks(){
    if(todoState !== 'signedin' || !window.bdevTodoTasks) return;
    window.bdevTodoTasks();
  }

  // renderTodoSignIn always leaves a working Sign in button behind, even
  // after a failed attempt (errorMsg, optional): without this, a failed or
  // expired device code left the panel permanently stuck on a static error
  // with no way to retry short of restarting the app, since pollTodoStatus
  // only ever calls this once per signedout transition (found by review,
  // 2026-09-25).
  function renderTodoSignIn(errorMsg){
    var body = document.getElementById('todoBody');
    if(!body) return;
    var errorHtml = errorMsg ? '<div class="placeholder" style="padding:4px 0">' + esc(errorMsg) + '</div>' : '';
    body.innerHTML = errorHtml + '<button class="textbtn" id="todoSignInBtn" style="align-self:flex-start">Sign in</button>';
    document.getElementById('todoSignInBtn').addEventListener('click', function(){
      this.disabled = true;
      if(!window.bdevTodoLogin) return;
      todoState = 'pending';
      window.bdevTodoLogin().then(function(info){
        if(todoState !== 'pending') return; // status poll already moved on
        body.innerHTML = '<div>' + esc(info.message) + '</div>' +
          '<div class="tododevicecode">' + esc(info.user_code) + '</div>' +
          '<div class="dim">Waiting for approval&hellip; a browser window should already be open.</div>';
      }).catch(function(e){
        todoState = 'signedout';
        renderTodoSignIn('Sign-in failed: ' + (e && e.message ? e.message : String(e)));
      });
    });
  }

  window.__bdevTodoLoginResolve = function(result){
    if(!result || !result.ok){
      todoState = 'signedout';
      renderTodoSignIn('Sign-in failed' + (result && result.error ? ': ' + result.error : ''));
      return;
    }
    todoState = 'signedin';
    pollTodoTasks();
  };

  function pollTodoStatus(){
    if(!window.bdevTodoStatus) return;
    window.bdevTodoStatus().then(function(status){
      var panel = document.getElementById('todoPanel');
      if(!panel) return;
      if(!status || !status.enabled){
        panel.style.display = 'none';
        todoState = 'unknown';
        return;
      }
      panel.style.display = 'flex';
      if(status.signed_in){
        if(todoState !== 'signedin'){ todoState = 'signedin'; pollTodoTasks(); }
      } else if(todoState !== 'pending'){
        if(todoState !== 'signedout'){ todoState = 'signedout'; renderTodoSignIn(); }
      }
    }).catch(function(err){ console.error('bdevTodoStatus failed', err); });
  }

  setInterval(poll, 2000);
  setInterval(pollBurn, 2000);
  setInterval(pollProcessGroups, 10000);
  setInterval(pollVendorStrip, 60000);
  setInterval(pollActivityHeatmap, 60000);
  setInterval(pollSysmonHistory, 10000);
  setInterval(pollTodoStatus, 30000);
  setInterval(pollTodoTasks, 300000);
  setInterval(renderClock, 1000);
  renderClock();
  pollTodoStatus();

  // Section 10 (responsive, "panels grow and shrink with the window"): the
  // history canvas sets its backing-store pixel size from its container's
  // clientWidth/clientHeight at draw time (renderHistoryChart), so a window
  // resize between polls leaves it drawn at the OLD size while its CSS box
  // has already grown or shrunk to the new one, stretching/blurring the
  // existing bitmap until the next 10s poll redraws it (found visually
  // against a real resize this session, not just in review). Re-drawing
  // from the already-cached lastSysmonHistory on resize, debounced to one
  // redraw per animation frame rather than once per resize event, fixes it
  // without waiting on the next poll.
  var histResizeRAF = null;
  window.addEventListener('resize', function(){
    if(histResizeRAF) return;
    histResizeRAF = requestAnimationFrame(function(){
      histResizeRAF = null;
      renderHistoryChart(lastSysmonHistory);
    });
  });
  setupExportButton();
  // Section 11 step 1 (startup measurement): the first full render is the
  // page's own first poll cycle finishing, not a Go-side guess, so this
  // reports back to bdevMarkFirstRender exactly once, whichever of the
  // four initial polls below resolves last.
  Promise.all([poll(), pollSysmonHistory(), pollBurn(), pollVendorStrip()]).then(function(){
    if(window.bdevMarkFirstRender) window.bdevMarkFirstRender();
  });
  pollActivityHeatmap();
})();
</script>
</body>
</html>
