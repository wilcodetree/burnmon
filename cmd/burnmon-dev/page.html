<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BurnMon Dev</title>
<style>
:root{
  --bg:#04060a; --panel:#0a0e14; --panel2:#10151d; --bd:#1c2532;
  --amber:#ffa028; --amber2:#ffc46b;
  --txt:#cfd8e3; --dim:#66788c;
  --grn:#00d26a; --red:#ff4b4b; --blu:#4da6ff; --cyn:#38d3e3; --mag:#d68cf0; --yel:#ffd75f;
  --mono:Consolas,"Cascadia Mono","IBM Plex Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--txt); overflow:hidden;
  font:13px/1.45 var(--mono);
  display:flex; flex-direction:column;
}
header{
  flex:0 0 auto; min-height:44px; background:#000; border-bottom:2px solid var(--amber);
  display:flex; align-items:center; flex-wrap:wrap; gap:6px 14px; padding:6px 16px;
}
.logo{font-size:17px; font-weight:700; color:#fff; letter-spacing:1px; white-space:nowrap}
.logo span{color:var(--amber)}
#cmd{background:#1a1206;border:1px solid #6b4a12;color:var(--amber2);font:inherit;
  padding:4px 10px; flex:1 1 220px; min-width:0; outline:none}
#cmd:focus{border-color:var(--amber)}
.chip{padding:3px 10px; font-weight:700; font-size:12px; letter-spacing:.06em; white-space:nowrap;
  background:rgba(255,215,95,.14); color:var(--yel); border:1px solid rgba(255,215,95,.4)}
button.chip{font:inherit; cursor:pointer}
button.chip:disabled{opacity:.5; cursor:default}
.hstat{font-size:12px; color:var(--dim); white-space:nowrap}
.hstat b{color:var(--txt); font-weight:600; font-variant-numeric:tabular-nums}
.headline{display:flex; align-items:baseline; gap:5px; white-space:nowrap; flex:0 0 auto}
.hltotal{font-size:30px; font-weight:700; color:#fff; font-variant-numeric:tabular-nums}
.hlunit{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em}
.hlsub{font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums}

main{flex:1; min-height:0; display:flex; flex-direction:column; padding:4px; gap:4px}
.zone{display:flex; flex-direction:column; min-height:0}
.zone.burn{flex:45}
.zone.system{flex:55; border-top:2px solid var(--bd); padding-top:4px}
.zonelabel{
  flex:0 0 auto; background:var(--panel2); border-bottom:1px solid var(--bd); color:var(--amber);
  font:700 12px/1 var(--mono); letter-spacing:.1em; padding:6px 10px; text-transform:uppercase;
}
.zonebody{flex:1; min-height:0; padding:4px; display:flex; flex-direction:column; gap:4px; overflow:hidden}
.panel{background:var(--panel); border:1px solid var(--bd); display:flex; flex-direction:column; min-height:0}
.panelhead{font:700 11px/1 var(--mono); letter-spacing:.08em; color:var(--amber); text-transform:uppercase;
  padding:6px 10px; border-bottom:1px solid var(--bd); background:var(--panel2); flex:0 0 auto}
.placeholder{flex:1; display:flex; align-items:center; justify-content:center; color:var(--dim);
  font-size:12px; padding:20px; text-align:center}

.sysrow{display:flex; gap:4px; flex:0 0 auto}
.gauge{flex:1.3; background:var(--panel); border:1px solid var(--bd); padding:10px 12px;
  display:flex; flex-direction:column; gap:6px}
.gauge h4{margin:0; font:12px/1 var(--mono); color:var(--dim); letter-spacing:.06em;
  text-transform:uppercase; font-weight:400}
.gaugebig{font:700 26px/1 var(--mono); color:#fff}
.coregrid{display:grid; grid-template-columns:repeat(8,1fr); gap:3px; flex:1}
.coregrid i{display:block; padding-top:100%; position:relative; background:var(--bd)}
.tiles{flex:2.2; display:grid; grid-template-columns:repeat(2,1fr); gap:6px}
.tile{background:var(--panel); border:1px solid var(--bd); padding:8px 10px; min-width:0}
.tile b{display:block; font:11px/1 var(--mono); color:var(--dim); letter-spacing:.05em; text-transform:uppercase}
.tile .v{font:700 18px/1 var(--mono); color:#fff; margin-top:6px}

@media (max-aspect-ratio: 4/5){
  .tiles{grid-template-columns:repeat(4,1fr)}
  header{min-height:56px}
  .hltotal{font-size:40px}
}

/* burn zone */
.burnchart{position:relative; flex:0 0 26%; padding:6px; overflow:hidden}
.bars{position:absolute; inset:6px; display:flex; gap:2px}
.bars .bar{flex:1; display:flex; flex-direction:column-reverse; min-width:0}
.bars .bar i{display:block; min-height:2px}
.cpuline{position:absolute; inset:6px; width:calc(100% - 12px); height:calc(100% - 12px); pointer-events:none}
.cards{display:flex; gap:6px; flex-wrap:wrap; flex:0 0 auto}
.card{flex:1 1 140px; background:var(--panel); border:1px solid var(--bd); padding:8px 10px; min-width:0}
.card h4{margin:0 0 4px; font:12px/1 var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ctxbar{height:5px; background:#1a2330; margin:4px 0}
.ctxbar i{display:block; height:100%}
.card small{display:block; font:11px/1.4 var(--mono); color:var(--dim)}
.card small b{color:var(--txt); font-weight:600}
table{width:100%; border-collapse:collapse; font:11.5px/1.3 var(--mono)}
th{color:var(--dim); font-weight:400; text-align:left; letter-spacing:.05em; font-size:10px; padding:4px 8px; text-transform:uppercase}
td{padding:4px 8px; color:var(--txt); white-space:nowrap}
td.num{text-align:right; font-variant-numeric:tabular-nums}
.dot{display:inline-block; width:8px; height:8px; border-radius:1px; margin-right:5px; vertical-align:middle}
.ticker{display:flex; flex-direction:column; gap:3px; flex:1; min-height:0; overflow-y:auto; padding:6px 10px}
.trow{display:flex; gap:8px; align-items:baseline; font:11.5px/1.4 var(--mono); white-space:nowrap; overflow:hidden}
.trow .t{color:var(--dim)}
.trow .h{font-weight:600}
.trow .m{color:var(--txt); overflow:hidden; text-overflow:ellipsis}
.tag{font:10px/1 var(--mono); padding:2px 5px; border:1px solid; text-transform:uppercase; letter-spacing:.03em}
.tag.expensive-turn{color:var(--red); border-color:var(--red)}
.tag.context-runway{color:var(--yel); border-color:var(--yel)}
.tag.re-prefill{color:var(--cyn); border-color:var(--cyn)}
.tag.compaction{color:var(--mag); border-color:var(--mag)}

/* vendor strip row expand */
tbody tr.vrow{cursor:pointer}
tbody tr.vrow:hover{background:var(--panel2)}
tr.vexpand td{padding:6px 8px 8px 24px; color:var(--txt); font-size:11px; background:#0d1219; border-top:1px dashed var(--bd)}
tr.vexpand b{font-variant-numeric:tabular-nums}

/* activity heatmap, phase 2b */
.phead-sub{float:right; color:var(--dim); font-weight:400; text-transform:none; letter-spacing:0}
.heatmapwrap{padding:8px 10px; overflow-x:auto}
.heatgrid{display:flex; gap:2px}
.heatcol{display:flex; flex-direction:column; gap:2px}
.heatcell{width:9px; height:9px; background:var(--bd); border-radius:1px}
.heatcell.active{background:var(--grn)}
.heatcell.empty{background:transparent}
.heatmonths{display:flex; gap:2px; margin-top:3px}
.heatmonth{width:9px; font-size:8px; color:var(--dim); overflow:visible; white-space:nowrap}

/* harness x minute heatmap, phase 3 */
.heatrow{display:flex; align-items:center; gap:6px; margin-bottom:2px}
.heatrow-label{width:120px; flex:0 0 auto; font-size:11px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.heatrow-cells{display:flex; gap:1px; flex-wrap:nowrap}
</style>
</head>
<body>
<header>
  <div class="logo">BURN<span>MON</span> DEV</div>
  <div class="headline">
    <span class="hltotal" id="hlToday">-</span><span class="hlunit">tok today</span>
    <span class="hlsub">&middot; <span id="hlWeek">-</span> wk &middot; <span id="hlMonth">-</span> mo</span>
  </div>
  <input id="cmd" placeholder="/ search sessions, vendors, findings&hellip;" autocomplete="off" spellcheck="false">
  <div class="chip" id="pressureChip">PRESSURE -</div>
  <div class="hstat" id="hdrSessions">- sessions</div>
  <div class="hstat"><b id="hdrBurnRate">-</b>/min</div>
  <div class="hstat"><b id="hdrTokMin">-</b> tok/min</div>
  <div class="hstat">CPU <b id="hdrCPU">-</b></div>
  <div class="hstat">RAM <b id="hdrRAM">-</b></div>
  <div class="hstat" id="hdrClock">-</div>
  <button class="chip" id="exportBtn" style="background:rgba(77,166,255,.14);color:var(--blu);border-color:rgba(77,166,255,.4)" title="Export the last 24 hours to an AI-ready bundle">EXPORT</button>
  <div class="hstat" id="exportStatus"></div>
</header>
<main>
  <section class="zone burn">
    <div class="zonelabel">Burn, last 30 min</div>
    <div class="zonebody">
      <div class="burnchart panel">
        <div class="bars" id="burnBars"></div>
        <svg class="cpuline" id="cpuLine" preserveAspectRatio="none"></svg>
        <svg class="cpuline" id="turnMarkers" preserveAspectRatio="none"></svg>
      </div>
      <div class="cards" id="sessionCards"></div>
      <div class="panel" style="flex:0 0 auto">
        <div class="panelhead">Vendor strip</div>
        <table>
          <thead><tr><th></th><th>Today</th><th>Week</th><th>Month</th></tr></thead>
          <tbody id="vendorStrip"></tbody>
        </table>
      </div>
      <div class="panel" style="flex:0 0 auto">
        <div class="panelhead">Activity <span id="heatmapActiveDays" class="phead-sub"></span></div>
        <div class="heatmapwrap"><div id="heatmapGrid"></div></div>
      </div>
      <div class="panel" style="flex:1">
        <div class="panelhead">Turn ticker</div>
        <div class="ticker" id="turnTicker"></div>
      </div>
    </div>
  </section>
  <section class="zone system">
    <div class="zonelabel">System</div>
    <div class="zonebody">
      <div class="sysrow" style="flex:0 0 auto">
        <div class="gauge">
          <h4>CPU total</h4>
          <div class="gaugebig" id="cpuTotal">-</div>
          <div class="coregrid" id="coreGrid"></div>
        </div>
        <div class="tiles">
          <div class="tile"><b>Memory</b><div class="v" id="tileMem">-</div></div>
          <div class="tile"><b>Disk I/O</b><div class="v" id="tileDisk">-</div></div>
          <div class="tile"><b>Network</b><div class="v" id="tileNet">-</div></div>
          <div class="tile"><b>GPU</b><div class="v" id="tileGPU">-</div></div>
        </div>
      </div>
      <div class="panel" style="flex:0 0 auto">
        <div class="panelhead">Process groups</div>
        <table>
          <thead><tr><th></th><th>CPU</th><th>RAM</th><th>IO/s</th><th>Trend</th></tr></thead>
          <tbody id="processGroups"></tbody>
        </table>
      </div>
      <div class="panel" style="flex:1; display:flex; flex-direction:column">
        <div class="panelhead">Heatmap, harness &times; minute (CPU-weighted)</div>
        <div class="heatmapwrap" style="flex:1; overflow-y:auto"><div id="harnessHeatmap"></div></div>
      </div>
      <div class="panel" style="flex:0 0 auto; max-height:220px; display:flex; flex-direction:column">
        <div class="panelhead">Today's read</div>
        <div class="ticker" id="advisorFindings" style="max-height:180px"></div>
      </div>
    </div>
  </section>
</main>
<script>
(function(){
  var AGENT_COLOR = {
    'claude-code': '#ffa028',
    'cowork': '#ffc46b',
    'codex': '#4da6ff',
    'hermes': '#d68cf0',
    'copilot-cli': '#38d3e3',
    'copilot-vscode': '#38d3e3'
  };
  // Fixed draw order for the burn chart's stacked segments: Object.keys on
  // a bucket's by-agent totals would otherwise follow whatever order the
  // Go map happened to marshal in, which is not stable poll to poll, so
  // segments would visibly swap position between bars.
  var AGENT_ORDER = ['claude-code', 'cowork', 'codex', 'hermes', 'copilot-cli', 'copilot-vscode', 'other'];
  function agentColor(agent){ return AGENT_COLOR[agent] || '#66788c'; }

  var REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // animateNumber (token-monitor's own recipe, reimplemented): one RAF tween
  // per element, easeOutQuart, cancelling any tween already running on that
  // element so a fast poll cadence never lets an old loop overwrite a
  // newer value. State (_animVal, _animRAF) lives on the element itself, so
  // callers must reuse the same DOM node across polls rather than
  // rebuilding it each time (see ensureVendorRow).
  function animateNumber(el, newVal, duration, formatFn){
    if(!el || newVal == null) return;
    if(REDUCED_MOTION){
      el.textContent = formatFn(newVal);
      el._animVal = newVal;
      return;
    }
    var from = el._animVal != null ? el._animVal : newVal;
    if(el._animRAF) cancelAnimationFrame(el._animRAF);
    if(from === newVal){ el.textContent = formatFn(newVal); el._animVal = newVal; return; }
    var start = performance.now();
    function tick(now){
      var t = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - t, 4);
      var val = from + (newVal - from) * eased;
      el.textContent = formatFn(val);
      if(t < 1){
        el._animRAF = requestAnimationFrame(tick);
      } else {
        el._animVal = newVal;
        el._animRAF = null;
      }
    }
    el._animRAF = requestAnimationFrame(tick);
  }

  function fmtTokens(n){
    if(n == null) return '-';
    if(n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if(n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(n);
  }
  function fmtCost(c){ return '$' + (c || 0).toFixed(2); }

  function fmtBytes(bps){
    if(bps == null) return '-';
    var units = ['B/s','KB/s','MB/s','GB/s'];
    var v = bps, i = 0;
    while(v >= 1024 && i < units.length - 1){ v /= 1024; i++; }
    return v.toFixed(v < 10 ? 1 : 0) + ' ' + units[i];
  }

  function renderCores(cores){
    var grid = document.getElementById('coreGrid');
    if(!grid) return;
    var html = '';
    (cores || []).forEach(function(pct){
      var color = pct < 45 ? 'var(--grn)' : pct < 75 ? 'var(--yel)' : 'var(--red)';
      var op = 0.35 + Math.min(pct, 100) / 130;
      html += '<i style="background:' + color + ';opacity:' + op.toFixed(2) + '"></i>';
    });
    grid.innerHTML = html;
  }

  function renderClock(){
    var el = document.getElementById('hdrClock');
    if(el) el.textContent = new Date().toLocaleTimeString();
  }

  // agentBySessionMap must cover every session_id the chart's by_session
  // buckets can name, not just the top-level running sessions: a session
  // that stopped within the 30-min chart window is gone from snap.sessions
  // but still has bars, and a subagent never appears at the top level at
  // all (it nests under its parent's Subagents). Walking sessions
  // recursively covers the first case only while it is still running;
  // snap.turns (every real turn in the chart window, running or not) is
  // the fallback that covers both, so it is applied first and the
  // recursive walk fills in anything turns missed (e.g. a session with no
  // turn yet).
  function agentBySessionMap(sessions, turns){
    var m = {};
    (turns || []).forEach(function(t){ m[t.session_id] = t.agent; });
    (function walk(list){
      (list || []).forEach(function(s){
        m[s.session_id] = s.agent;
        walk(s.subagents);
      });
    })(sessions);
    return m;
  }

  function renderBars(chart, agentBySession){
    var el = document.getElementById('burnBars');
    if(!el) return;
    var totals = (chart || []).map(function(bucket){
      var perAgent = {};
      var bySession = bucket.by_session || {};
      Object.keys(bySession).forEach(function(sid){
        var agent = agentBySession[sid] || 'other';
        var c = bySession[sid];
        var tok = (c.fresh || 0) + (c.cache_write || 0) + (c.cache_read || 0) + (c.output || 0);
        perAgent[agent] = (perAgent[agent] || 0) + tok;
      });
      return perAgent;
    });
    var max = 1;
    totals.forEach(function(t){
      var sum = Object.keys(t).reduce(function(a, k){ return a + t[k]; }, 0);
      if(sum > max) max = sum;
    });
    var html = '';
    totals.forEach(function(t){
      html += '<div class="bar">';
      var agents = AGENT_ORDER.filter(function(a){ return t[a] != null; })
        .concat(Object.keys(t).filter(function(a){ return AGENT_ORDER.indexOf(a) === -1; }));
      agents.forEach(function(agent){
        var pct = 100 * t[agent] / max;
        if(t[agent] > 0) pct = Math.max(pct, 1.5); // a real but tiny bucket still shows a sliver
        html += '<i style="height:' + pct.toFixed(1) + '%;background:' + agentColor(agent) + '"></i>';
      });
      html += '</div>';
    });
    el.innerHTML = html;
  }

  // A sample more than a minute away from a chart bucket (empty history
  // just after startup, or a gap after the app was suspended) is not a
  // real reading for that bucket; drawing it anyway either shows a false
  // flat 0% or copies one distant sample across many buckets. Such buckets
  // are simply omitted from the polyline rather than pinned to 0.
  var CPU_LINE_MAX_STALENESS_MS = 60000;

  function renderCPULine(history, chart){
    var svg = document.getElementById('cpuLine');
    if(!svg) return;
    if(!chart || !chart.length || !history || !history.length){ svg.innerHTML = ''; return; }
    var n = chart.length;
    var pts = [];
    chart.forEach(function(bucket, i){
      var t = new Date(bucket.at).getTime();
      var nearest = null, bestDiff = Infinity;
      history.forEach(function(sm){
        var diff = Math.abs(new Date(sm.Ts).getTime() - t);
        if(diff < bestDiff){ bestDiff = diff; nearest = sm; }
      });
      if(!nearest || bestDiff > CPU_LINE_MAX_STALENESS_MS) return;
      var x = (i / Math.max(n - 1, 1)) * 100;
      var y = 100 - Math.min(nearest.CPUPct, 100);
      pts.push(x.toFixed(1) + ',' + y.toFixed(1));
    });
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.innerHTML = pts.length
      ? '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.85" vector-effect="non-scaling-stroke"/>'
      : '';
  }

  // renderTurnMarkers draws one small tick per turn at its real position in
  // the 30-minute window (design doc: "agent turns as markers on the
  // system charts"), interpolated linearly between the chart's first and
  // last bucket timestamps rather than snapped to the nearest bucket, so a
  // burst of turns inside one bucket still spreads out left-to-right. A
  // turn with a finding (insight.Finding) draws taller and in that
  // finding's own tag colour; a plain turn draws short and dim.
  var FINDING_MARKER_COLOR = {
    'expensive-turn': '#ff4b4b', 'context-runway': '#ffd75f',
    're-prefill': '#38d3e3', 'compaction': '#d68cf0'
  };
  function renderTurnMarkers(turns, chart){
    var svg = document.getElementById('turnMarkers');
    if(!svg) return;
    if(!chart || chart.length < 2 || !turns || !turns.length){ svg.innerHTML = ''; return; }
    var t0 = new Date(chart[0].at).getTime();
    var t1 = new Date(chart[chart.length - 1].at).getTime();
    if(t1 <= t0){ svg.innerHTML = ''; return; }
    var html = '';
    turns.forEach(function(t){
      var x = 100 * (new Date(t.at).getTime() - t0) / (t1 - t0);
      if(x < 0 || x > 100) return;
      var color = t.finding ? (FINDING_MARKER_COLOR[t.finding.Kind] || '#ffa028') : 'rgba(255,255,255,.25)';
      var y2 = t.finding ? 100 : 12;
      html += '<line x1="' + x.toFixed(1) + '" y1="0" x2="' + x.toFixed(1) + '" y2="' + y2 +
        '" stroke="' + color + '" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    });
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.innerHTML = html;
  }

  function renderSessionCards(sessions){
    var el = document.getElementById('sessionCards');
    if(!el) return;
    var html = '';
    (sessions || []).forEach(function(s){
      var pct = s.context_window > 0 ? Math.min(100, 100 * s.context / s.context_window) : 0;
      html += '<div class="card">' +
        '<h4 style="color:' + agentColor(s.agent) + '">' + (s.agent || s.vendor) + '</h4>' +
        '<div class="ctxbar"><i style="width:' + pct.toFixed(0) + '%;background:' + agentColor(s.agent) + '"></i></div>' +
        '<small>turn ' + s.turn_count + ' &middot; ' + fmtTokens(s.tokens) + ' tok &middot; ' + fmtCost(s.cost) + '</small>' +
        '</div>';
    });
    el.innerHTML = html || '<div class="placeholder" style="flex:0 0 auto;padding:10px">No sessions running</div>';
  }

  // Vendor strip rows are created once per agent and updated in place on
  // every poll (rather than rebuilt via innerHTML), so animateNumber's
  // per-element tween state survives across polls and a row's expanded
  // cache-breakdown detail is not wiped out from under an open click.
  var vendorRowEls = {};
  var expandedVendor = null;
  var expandRowEl = null;

  function collapseVendorExpand(){
    if(expandRowEl){ expandRowEl.remove(); expandRowEl = null; }
    expandedVendor = null;
  }

  function toggleVendorExpand(agent){
    if(expandedVendor === agent){ collapseVendorExpand(); return; }
    collapseVendorExpand();
    var rec = vendorRowEls[agent];
    if(!rec) return;
    expandedVendor = agent;
    var tr = document.createElement('tr');
    tr.className = 'vexpand';
    var td = document.createElement('td');
    td.colSpan = 4;
    td.textContent = 'Loading cache breakdown…';
    tr.appendChild(td);
    rec.tr.parentNode.insertBefore(tr, rec.tr.nextSibling);
    expandRowEl = tr;
    if(!window.bdevCacheBreakdown) return;
    window.bdevCacheBreakdown(agent).then(function(t){
      if(expandedVendor !== agent) return; // collapsed, or another row opened, while this was in flight
      t = t || {};
      var miss = (t.fresh || 0) + (t.cache_w || 0);
      var hit = t.cache_r || 0;
      var denom = miss + hit;
      var rate = denom > 0 ? (100 * hit / denom) : 0;
      td.innerHTML = 'Input today: <b>' + fmtTokens(miss) + '</b> miss / <b style="color:var(--grn)">' +
        fmtTokens(hit) + '</b> hit &middot; Output: <b>' + fmtTokens(t.out || 0) +
        '</b> &middot; Hit rate: <b>' + rate.toFixed(0) + '%</b>';
    }).catch(function(err){
      console.error('bdevCacheBreakdown failed', err);
      if(expandedVendor === agent) td.textContent = 'Cache breakdown unavailable';
    });
  }

  function ensureVendorRow(tbody, agent, label){
    var rec = vendorRowEls[agent];
    if(rec) return rec;
    var tr = document.createElement('tr');
    tr.className = 'vrow';
    var tdName = document.createElement('td');
    tdName.innerHTML = '<span class="dot" style="background:' + agentColor(agent) + '"></span>' + label;
    var tdToday = document.createElement('td'); tdToday.className = 'num';
    var tdWeek = document.createElement('td'); tdWeek.className = 'num';
    var tdMonth = document.createElement('td'); tdMonth.className = 'num';
    tr.appendChild(tdName); tr.appendChild(tdToday); tr.appendChild(tdWeek); tr.appendChild(tdMonth);
    tr.addEventListener('click', function(){ toggleVendorExpand(agent); });
    tbody.appendChild(tr);
    rec = { tr: tr, today: tdToday, week: tdWeek, month: tdMonth };
    vendorRowEls[agent] = rec;
    return rec;
  }

  function renderVendorStrip(payload){
    var tbody = document.getElementById('vendorStrip');
    if(!tbody) return;
    var rows = (payload && payload.rows) || [];
    var seen = {};
    rows.forEach(function(r){
      seen[r.agent] = true;
      var rec = ensureVendorRow(tbody, r.agent, r.agent_label);
      animateNumber(rec.today, r.today, 400, fmtTokens);
      animateNumber(rec.week, r.week, 400, fmtTokens);
      animateNumber(rec.month, r.month, 400, fmtTokens);
    });
    Object.keys(vendorRowEls).forEach(function(agent){
      if(seen[agent]) return;
      if(expandedVendor === agent) collapseVendorExpand();
      vendorRowEls[agent].tr.remove();
      delete vendorRowEls[agent];
    });
  }

  function renderHeadline(total){
    total = total || {};
    animateNumber(document.getElementById('hlToday'), total.today || 0, 1000, fmtTokens);
    animateNumber(document.getElementById('hlWeek'), total.week || 0, 1000, fmtTokens);
    animateNumber(document.getElementById('hlMonth'), total.month || 0, 1000, fmtTokens);
  }

  var MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function mondayOnOrBefore(d){
    var m = new Date(d.getTime());
    var diff = (d.getUTCDay() + 6) % 7; // 0=Monday .. 6=Sunday
    m.setUTCDate(d.getUTCDate() - diff);
    return m;
  }

  // renderHeatmap lays internal/history's own per-day rows out as a
  // GitHub-style grid: Monday-start weeks (this codebase's own ISO-week
  // convention, used elsewhere for the same "week" concept), one column
  // per week, oldest first, 182 days (26 weeks) ending today.
  function renderHeatmap(payload){
    var grid = document.getElementById('heatmapGrid');
    var activeEl = document.getElementById('heatmapActiveDays');
    if(!grid) return;
    var byDate = {};
    ((payload && payload.rows) || []).forEach(function(r){ byDate[r.key] = r; });

    var now = new Date();
    var today = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
    var start = new Date(today.getTime());
    start.setUTCDate(start.getUTCDate() - 181);
    var gridStart = mondayOnOrBefore(start);
    var weeks = Math.floor((today.getTime() - gridStart.getTime()) / 604800000) + 1;

    var cols = [];
    var activeDays = 0;
    for(var w = 0; w < weeks; w++){
      var col = [];
      for(var d = 0; d < 7; d++){
        var day = new Date(gridStart.getTime());
        day.setUTCDate(gridStart.getUTCDate() + w * 7 + d);
        if(day < start || day > today){ col.push(null); continue; }
        var key = day.toISOString().slice(0, 10);
        var row = byDate[key];
        var tokens = row ? row.tokens : 0;
        var cost = row && row.cost_usd != null ? row.cost_usd : null;
        if(tokens > 0) activeDays++;
        col.push({ date: key, tokens: tokens, cost: cost });
      }
      cols.push(col);
    }

    var max = 1;
    cols.forEach(function(col){ col.forEach(function(c){ if(c && c.tokens > max) max = c.tokens; }); });

    var html = '<div class="heatgrid">';
    cols.forEach(function(col){
      html += '<div class="heatcol">';
      col.forEach(function(c){
        if(!c){ html += '<i class="heatcell empty"></i>'; return; }
        var active = c.tokens > 0;
        var op = active ? (0.15 + 0.85 * Math.min(1, c.tokens / max)) : 0;
        var title = c.date + ': ' + fmtTokens(c.tokens) + ' tok' + (c.cost != null ? ', ' + fmtCost(c.cost) : '');
        html += '<i class="heatcell' + (active ? ' active' : '') + '" style="opacity:' + op.toFixed(2) + '" title="' + title + '"></i>';
      });
      html += '</div>';
    });
    html += '</div><div class="heatmonths">';
    var lastMonth = null;
    cols.forEach(function(col){
      var first = null;
      for(var i = 0; i < col.length; i++){ if(col[i]){ first = col[i]; break; } }
      var m = first ? new Date(first.date + 'T00:00:00Z').getUTCMonth() : null;
      var label = (m !== null && m !== lastMonth) ? MONTH_ABBR[m] : '';
      if(m !== null) lastMonth = m;
      html += '<div class="heatmonth">' + label + '</div>';
    });
    html += '</div>';
    grid.innerHTML = html;
    if(activeEl) activeEl.textContent = activeDays + ' active days';
  }

  function renderTicker(turns){
    var el = document.getElementById('turnTicker');
    if(!el) return;
    var html = '';
    (turns || []).slice(0, 30).forEach(function(t){
      var time = new Date(t.at).toLocaleTimeString();
      var tag = '';
      if(t.finding){
        tag = '<span class="tag ' + t.finding.Kind + '">' + t.finding.Kind + '</span>';
      }
      var tok = (t.fresh || 0) + (t.cache_write || 0) + (t.cache_read || 0) + (t.output || 0);
      html += '<div class="trow"><span class="t">' + time + '</span>' +
        '<span class="h" style="color:' + agentColor(t.agent) + '">' + t.agent + '</span>' +
        tag +
        '<span class="m">' + fmtTokens(tok) + ' tok</span></div>';
    });
    el.innerHTML = html || '<div class="placeholder" style="padding:10px">No turns in the last 30 minutes</div>';
  }

  var lastSysmonHistory = [];

  // recentBuckets returns the chart's last N seconds' worth of buckets,
  // for a rate that reflects a short trailing window rather than only the
  // current, still-filling bucket (which reads low right after a bucket
  // boundary and would otherwise make both the $/min chip and tok/min jump
  // every tick).
  function recentBuckets(chart, seconds, bucketSeconds){
    var n = Math.max(1, Math.round(seconds / Math.max(bucketSeconds, 1)));
    return chart.slice(-n);
  }

  function renderHeaderBurn(snap){
    var sessionsEl = document.getElementById('hdrSessions');
    if(sessionsEl) sessionsEl.textContent = (snap.sessions || []).length + ' sessions';
    var chart = snap.chart || [];
    var bucketSeconds = snap.bucket_seconds || 60;
    var recent = recentBuckets(chart, 300, bucketSeconds);
    var minutes = recent.length * bucketSeconds / 60;

    var rateEl = document.getElementById('hdrBurnRate');
    if(rateEl){
      var cost = recent.reduce(function(sum, b){ return sum + (b.cost || 0); }, 0);
      rateEl.textContent = fmtCost(minutes > 0 ? cost / minutes : 0);
    }

    var tokMinEl = document.getElementById('hdrTokMin');
    if(tokMinEl){
      var tokens = 0;
      recent.forEach(function(bucket){
        var bySession = bucket.by_session || {};
        Object.keys(bySession).forEach(function(sid){
          var c = bySession[sid];
          tokens += (c.fresh || 0) + (c.cache_write || 0) + (c.cache_read || 0) + (c.output || 0);
        });
      });
      tokMinEl.textContent = fmtTokens(minutes > 0 ? tokens / minutes : 0);
    }
  }

  function pollBurn(){
    if(!window.bdevBurnNow) return;
    window.bdevBurnNow().then(function(snap){
      if(!snap) return;
      var agentBySession = agentBySessionMap(snap.sessions, snap.turns);
      renderBars(snap.chart, agentBySession);
      renderCPULine(lastSysmonHistory, snap.chart);
      renderTurnMarkers(snap.turns, snap.chart);
      renderSessionCards(snap.sessions);
      renderTicker(snap.turns);
      renderHeaderBurn(snap);
    }).catch(function(err){ console.error('bdevBurnNow failed', err); });
  }

  function pollVendorStrip(){
    if(!window.bdevVendorStrip) return;
    window.bdevVendorStrip().then(function(payload){
      renderVendorStrip(payload);
      renderHeadline(payload && payload.total);
    }).catch(function(err){ console.error('bdevVendorStrip failed', err); });
  }

  // bdevActivityHeatmap returns immediately (its real work runs off the
  // Go side's UI thread, see main.go's own comment) and delivers its
  // result through this resolver instead of the call's own Promise, which
  // would just resolve with undefined. A 182-day scan is not something to
  // run on bdevBurnNow's 2s cadence either, so this polls at the same
  // 1-minute cadence as the vendor strip: "today"'s heatmap cell can lag
  // up to a minute.
  window.__bdevActivityHeatmapResolve = renderHeatmap;

  function pollActivityHeatmap(){
    if(!window.bdevActivityHeatmap) return;
    window.bdevActivityHeatmap();
  }

  function pollSysmonHistory(){
    if(!window.bdevSysmonHistory) return;
    window.bdevSysmonHistory(1800).then(function(history){
      lastSysmonHistory = history || [];
    }).catch(function(err){ console.error('bdevSysmonHistory failed', err); });
  }

  function renderPressureChip(score){
    var el = document.getElementById('pressureChip');
    if(!el) return;
    el.textContent = 'PRESSURE ' + score;
    var color = score < 45 ? 'var(--grn)' : score < 75 ? 'var(--yel)' : 'var(--red)';
    el.style.color = color;
    el.style.borderColor = color;
    el.style.background = 'transparent';
  }

  function poll(){
    if(!window.bdevSysmonNow){ return; }
    window.bdevSysmonNow().then(function(sm){
      if(!sm) return;
      var cpuEl = document.getElementById('cpuTotal');
      if(cpuEl) cpuEl.textContent = Math.round(sm.CPUPct) + '%';
      var hdrCPU = document.getElementById('hdrCPU');
      if(hdrCPU) hdrCPU.textContent = Math.round(sm.CPUPct) + '%';
      var hdrRAM = document.getElementById('hdrRAM');
      if(hdrRAM && sm.MemTotalMB > 0) hdrRAM.textContent = Math.round(100 * sm.MemUsedMB / sm.MemTotalMB) + '%';
      var mem = document.getElementById('tileMem');
      if(mem) mem.textContent = (sm.MemUsedMB / 1024).toFixed(1) + ' GB';
      var disk = document.getElementById('tileDisk');
      if(disk) disk.textContent = fmtBytes(sm.DiskReadBps + sm.DiskWriteBps);
      var net = document.getElementById('tileNet');
      if(net) net.textContent = fmtBytes(sm.NetDownBps + sm.NetUpBps);
      var gpu = document.getElementById('tileGPU');
      if(gpu) gpu.textContent = (sm.GPUPct >= 0 ? sm.GPUPct.toFixed(0) : '-') + '%';
      renderCores(sm.Cores);
      renderPressureChip(sm.pressure_score);
    }).catch(function(err){ console.error('bdevSysmonNow failed', err); });
  }

  var HARNESS_LABEL = {
    'claude': 'Claude Code', 'claude-desktop': 'Claude Desktop', 'codex': 'Codex',
    'copilot-cli': 'Copilot CLI', 'copilot-vscode': 'Copilot (VS Code)', 'hermes': 'Hermes',
    'wsl': 'WSL', 'burnmon-dev': 'BurnMon Dev', 'node': 'node (unclassified)'
  };
  // internal/sysmon's Harness values are their own vocabulary ("claude",
  // not "claude-code"), separate from AGENT_COLOR above, which is keyed by
  // schema.Event.Agent (the burn side's own vocabulary); this table is
  // deliberately its own map rather than reusing AGENT_COLOR with the
  // wrong keys.
  var HARNESS_COLOR = {
    'claude': '#ffa028', 'claude-desktop': '#ffc46b', 'codex': '#4da6ff',
    'copilot-cli': '#38d3e3', 'copilot-vscode': '#38d3e3', 'hermes': '#d68cf0',
    'wsl': '#66788c', 'burnmon-dev': '#66788c', 'node': '#66788c'
  };
  function harnessColor(h){ return HARNESS_COLOR[h] || '#66788c'; }

  function renderProcessGroups(now, historyRows){
    var tbody = document.getElementById('processGroups');
    if(!tbody) return;
    var byHarness = {};
    (historyRows || []).forEach(function(r){
      (byHarness[r.Harness] || (byHarness[r.Harness] = [])).push(r);
    });
    var order = (now || []).slice().sort(function(a, b){ return b.CPUPct - a.CPUPct; });
    var html = '';
    order.forEach(function(row){
      var series = (byHarness[row.Harness] || []).slice(-30);
      var maxCPU = series.reduce(function(m, r){ return Math.max(m, r.CPUPct); }, 1);
      var pts = series.map(function(r, i){
        var x = series.length > 1 ? (i / (series.length - 1)) * 42 : 0;
        var y = 12 - Math.min(12, 12 * r.CPUPct / maxCPU);
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
      html += '<tr><td><span class="dot" style="background:' + harnessColor(row.Harness) + '"></span>' +
        (HARNESS_LABEL[row.Harness] || row.Harness) + '</td>' +
        '<td class="num">' + row.CPUPct.toFixed(0) + '%</td>' +
        '<td class="num">' + (row.MemMB / 1024).toFixed(1) + 'G</td>' +
        '<td class="num">' + fmtBytes(row.IOBps) + '</td>' +
        '<td><svg width="42" height="12" viewBox="0 0 42 12">' +
        (pts ? '<polyline points="' + pts + '" fill="none" stroke="' + harnessColor(row.Harness) + '" stroke-width="1.2"/>' : '') +
        '</svg></td></tr>';
    });
    tbody.innerHTML = html || '<tr><td colspan="5" style="color:var(--dim);padding:8px">No classified processes yet</td></tr>';
  }

  // renderHarnessHeatmap buckets the same history rows into one-minute
  // columns per harness, CPU-weighted (design doc section 3): the sum of
  // every sample's CPUPct for that harness inside that minute, so a
  // harness with several processes each briefly busy still reads as a warm
  // cell rather than diluted by however many 2s ticks landed in it.
  function renderHarnessHeatmap(rows){
    var el = document.getElementById('harnessHeatmap');
    if(!el) return;
    if(!rows || !rows.length){ el.innerHTML = ''; return; }

    var byHarness = {};
    var minMin = Infinity, maxMin = -Infinity;
    rows.forEach(function(r){
      var minuteKey = Math.floor(new Date(r.Ts).getTime() / 60000);
      minMin = Math.min(minMin, minuteKey);
      maxMin = Math.max(maxMin, minuteKey);
      var byMin = (byHarness[r.Harness] || (byHarness[r.Harness] = {}));
      byMin[minuteKey] = (byMin[minuteKey] || 0) + r.CPUPct;
    });
    var harnesses = Object.keys(byHarness).sort(function(a, b){
      var sa = Object.values(byHarness[a]).reduce(function(x, y){ return x + y; }, 0);
      var sb = Object.values(byHarness[b]).reduce(function(x, y){ return x + y; }, 0);
      return sb - sa;
    });
    var cols = maxMin - minMin + 1;
    var max = 1;
    harnesses.forEach(function(h){
      Object.keys(byHarness[h]).forEach(function(m){ if(byHarness[h][m] > max) max = byHarness[h][m]; });
    });

    var html = '';
    harnesses.forEach(function(h){
      html += '<div class="heatrow"><span class="heatrow-label">' + (HARNESS_LABEL[h] || h) + '</span><span class="heatrow-cells">';
      for(var m = minMin; m <= maxMin; m++){
        var v = byHarness[h][m] || 0;
        var op = v > 0 ? (0.12 + 0.85 * Math.min(1, v / max)) : 0;
        html += '<i class="heatcell' + (v > 0 ? ' active' : '') + '" style="background:' + harnessColor(h) + ';opacity:' + op.toFixed(2) + '"></i>';
      }
      html += '</span></div>';
    });
    el.innerHTML = html;
  }

  // renderAdvisorFindings draws phase 4's "TODAY'S READ" panel: one line
  // per advisor.Finding (internal/advisor), newest first (the Go side
  // already sorts them that way), each with its rule id, message and one
  // concrete suggestion. rule_id colors reuse the turn ticker's own tag
  // palette where a rule maps naturally onto an existing finding kind, and
  // pick a free palette color for the three rules with no ticker
  // equivalent (harness-runaway, hard-faults-memory, self-overhead).
  var FINDING_RULE_COLOR = {
    'heavy-turn-pressure': '#ff4b4b', 'harness-runaway': '#ffd75f',
    'cache-hit-drop': '#38d3e3', 'context-window': '#ffd75f',
    'hard-faults-memory': '#ff4b4b', 'self-overhead': '#d68cf0'
  };
  function renderAdvisorFindings(findings){
    var el = document.getElementById('advisorFindings');
    if(!el) return;
    var html = '';
    (findings || []).slice(0, 20).forEach(function(f){
      var time = new Date(f.at).toLocaleTimeString();
      var color = FINDING_RULE_COLOR[f.rule_id] || '#ffa028';
      html += '<div class="trow" style="white-space:normal; align-items:flex-start">' +
        '<span class="t">' + time + '</span>' +
        '<span class="tag" style="color:' + color + ';border-color:' + color + '">' + f.rule_id + '</span>' +
        '<span class="m">' + f.message + '. ' + f.suggestion + '</span></div>';
    });
    el.innerHTML = html || '<div class="placeholder" style="padding:10px">No findings in the last hour</div>';
  }
  // Same async-resolve pattern as bdevActivityHeatmap: the binding returns
  // immediately and delivers its real result (computed off the Go side's
  // UI thread) through this resolver.
  window.__bdevAdvisorResolve = renderAdvisorFindings;

  function pollAdvisor(){
    if(!window.bdevAdvisorNow) return;
    window.bdevAdvisorNow();
  }

  function fmtBytesPlain(n){
    if(n == null) return '-';
    var units = ['B','KB','MB'];
    var v = n, i = 0;
    while(v >= 1024 && i < units.length - 1){ v /= 1024; i++; }
    return v.toFixed(v < 10 && i > 0 ? 1 : 0) + ' ' + units[i];
  }

  window.__bdevExportResolve = function(result){
    var btn = document.getElementById('exportBtn');
    var status = document.getElementById('exportStatus');
    if(btn) btn.disabled = false;
    if(!status) return;
    if(!result || !result.ok){
      status.textContent = 'export failed' + (result && result.error ? ': ' + result.error : '');
      status.style.color = 'var(--red)';
      return;
    }
    status.textContent = 'exported ' + fmtBytesPlain(result.summary_bytes + result.data_json_bytes + result.daily_csv_bytes) +
      ' to ' + result.dir;
    status.style.color = 'var(--grn)';
  };

  function setupExportButton(){
    var btn = document.getElementById('exportBtn');
    if(!btn) return;
    btn.addEventListener('click', function(){
      if(!window.bdevExport) return;
      btn.disabled = true;
      var status = document.getElementById('exportStatus');
      if(status){ status.textContent = 'exporting...'; status.style.color = 'var(--dim)'; }
      window.bdevExport();
    });
  }

  function pollProcessGroups(){
    if(!window.bdevProcessGroupsNow || !window.bdevProcessGroupsHistory) return;
    Promise.all([window.bdevProcessGroupsNow(), window.bdevProcessGroupsHistory(60)])
      .then(function(results){
        var now = results[0], history = results[1];
        renderProcessGroups(now, history);
        renderHarnessHeatmap(history);
      })
      .catch(function(err){ console.error('process groups poll failed', err); });
  }

  setInterval(poll, 2000);
  setInterval(pollBurn, 2000);
  setInterval(pollProcessGroups, 10000);
  setInterval(pollVendorStrip, 60000);
  setInterval(pollActivityHeatmap, 60000);
  setInterval(pollSysmonHistory, 10000);
  setInterval(pollAdvisor, 15000);
  setInterval(renderClock, 1000);
  renderClock();
  setupExportButton();
  poll();
  pollSysmonHistory();
  pollBurn();
  pollVendorStrip();
  pollActivityHeatmap();
  pollAdvisor();
})();
</script>
</body>
</html>
