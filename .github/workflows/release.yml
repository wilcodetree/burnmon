name: release

# B1 (02_roadmap/2026-09-23_v0.3_spec.md, section 2.4): builds burnmon and
# burnmon-cli for darwin and linux, amd64 and arm64, CGO_ENABLED=0 (pure Go,
# no WebView2: main_other.go's browser-mode entry point), and attaches them
# to the pushed tag's GitHub release. Windows builds stay build.ps1's job
# (go-winres icons, WebView2), not duplicated here.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build burnmon and burnmon-cli
        run: |
          mkdir dist
          go build -trimpath -ldflags "-s -w" -o dist/burnmon-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/burnmon
          go build -trimpath -ldflags "-s -w" -o dist/burnmon-cli-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/burnmon-cli
      - uses: actions/upload-artifact@v4
        with:
          name: burnmon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach artefacts to the tag's release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
